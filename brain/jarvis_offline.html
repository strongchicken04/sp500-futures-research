<style>
/* Mozek: one screen. Rotatable 3D brain with the six agents, the picked agent's
   card beside it, then the final strategies (evaluation, funded) with copyable
   Pine code. Colours follow the owner's Lucid account screen: near-black
   background, black cards with a thin grey edge, grey spaced caps for labels,
   white bold values, Lucid green as the accent (red and blue as in its chart).
   Dark only, on purpose. */
:root {
  --bg: #050505;
  --card: #0b0b0b;
  --card2: #141414;
  --line: #262626;
  --fg: #f5f5f5;
  --muted: #a3a3a3;
  --faint: #6b6b6b;
  --accent: #34d27b;
  --accent-soft: rgba(52, 210, 123, 0.12);
  --on-accent: #04140b;
  --ok: #34d27b;
  --ok-soft: rgba(52, 210, 123, 0.12);
  --warn: #f5b94a;
  --warn-soft: rgba(245, 185, 74, 0.12);
  --bad: #f26b6b;
  --bad-soft: rgba(242, 107, 107, 0.12);
  --blue: #5b9cf6;
  --dot: 150, 160, 155;
  --code-bg: #070707;
  --shadow: none;
  --f: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 14px; line-height: 1.5;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1240px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: var(--f); }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 18px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
.logo svg { width: 18px; height: 18px; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.brand small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: -2px; }
.top .sp { flex: 1; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; color: var(--muted); white-space: nowrap; box-shadow: var(--shadow); }
.pill b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pill.ok i { background: var(--ok); } .pill.warn i { background: var(--warn); } .pill.bad i { background: var(--bad); }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); min-width: 0; }
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.brain { position: relative; padding: 14px 14px 12px; display: flex; flex-direction: column; }
.brain .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--muted); }
.brain .hd b { color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
.stage { position: relative; height: clamp(300px, 46vw, 430px); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.chips button i { width: 9px; height: 9px; border-radius: 50%; }
.chips button:hover { color: var(--fg); }
.chips button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.chips button .live { font-size: 10.5px; color: var(--ok); font-weight: 700; }

/* agent panel */
.agent { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.agent .ah { display: flex; align-items: center; gap: 12px; }
.agent .dotbig { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 4px var(--card2); }
.agent h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.agent .role { color: var(--muted); font-size: 13px; }
.agent .state { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--card2); color: var(--muted); white-space: nowrap; }
.agent .state.on { background: var(--ok-soft); color: var(--ok); }
.lbl { font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.now { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.now small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .sub { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; margin-top: -2px; }
.kv li { grid-template-columns: minmax(110px, 0.8fr) minmax(0, 1.6fr); }
.kv li span:first-child { color: var(--muted); }
.steps li { grid-template-columns: 46px minmax(0, 1fr); }
.steps time { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.tag { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: var(--card2); color: var(--muted); white-space: nowrap; align-self: start; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.acc { background: var(--accent-soft); color: var(--accent); }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.num { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.num .v { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; overflow-wrap: anywhere; line-height: 1.25; margin-top: 2px; }
.num .l { font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.num .s { font-size: 11.5px; color: var(--faint); }
.num.ok .v { color: var(--ok); } .num.bad .v { color: var(--bad); } .num.gold .v { color: var(--warn); }
.todo { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; }
details.more summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
details.more pre { white-space: pre-wrap; font-family: var(--f); font-size: 13px; color: var(--muted); margin: 8px 0 0; }

/* strategies */
.sec { margin-top: 30px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.sec-h h2::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 10px; vertical-align: 2px; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13px; }
.sum { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.sum span { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.sum b { color: var(--fg); font-variant-numeric: tabular-nums; }
.strats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; align-items: start; }
.strat { padding: 16px; display: grid; gap: 10px; }
.strat .sh { display: flex; align-items: flex-start; gap: 10px; }
.strat h3 { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.3; }
.strat .meta { color: var(--muted); font-size: 12.5px; }
.strat .slot { margin-left: auto; }
.strat .res { font-size: 13.5px; font-weight: 600; }
.sets { display: flex; flex-wrap: wrap; gap: 6px; }
.sets span { font-size: 12.5px; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; color: var(--muted); }
.sets b { color: var(--fg); font-weight: 700; }
.extra { font-size: 12.5px; color: var(--warn); }
.code { position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); overflow: hidden; }
.code pre { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--fg); max-height: 150px; overflow: auto; white-space: pre; tab-size: 4; }
.code.open pre { max-height: 560px; }
.code:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(transparent, var(--code-bg)); pointer-events: none; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 9px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.done { background: var(--ok); border-color: var(--ok); }
.acts .file { color: var(--faint); font-size: 12px; font-family: var(--mono); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.foot { margin-top: 26px; color: var(--faint); font-size: 12px; }
@media (max-width: 560px) { .kv li { grid-template-columns: minmax(0, 1fr); gap: 0; } .acts .file { margin-left: 0; } }
</style>

-10-23T07:26:00Z", "text": "Třetí účet s noise sprintem: jen −0,3 dne za ~100 $ navíc."}, {"sphere": "Backtester", "t": "2026-10-23T06:20:00Z", "text": "RS sprint se stopem 0,30 % nezávisle potvrzen."}, {"sphere": "Systémový manažer", "t": "2026-10-23T05:12:00Z", "text": "Simulace s časy obchodů: flat 3 potvrzen, denní stop nic nepřidá."}, {"sphere": "Backtester", "t": "2026-10-23T04:10:00Z", "text": "Opraveno řazení obchodů v simulaci."}, {"sphere": "Kodér", "t": "2026-10-22T21:31:00Z", "text": "Lucid 2 přepsán na průraz pásma VWAP ±0,20 %."}, {"sphere": "Kodér", "t": "2026-10-22T21:17:00Z", "text": "Lucid 6: pevný stop 0,50 %."}, {"sphere": "Systém", "t": "2026-10-22T21:08:00Z", "text": "Noční směna začala."}]}, "metrics": {"book": {"caption": "Doporučení 23. 10.: funded kniha bez ORB (Lucid 1) · ověřeno i na 2010–17 · 2018–21 | 2022–25", "tiles": [{"label": "První výplata bez ORB", "sub": "dnes 37 / 36 % funded účtů", "tone": "ok", "value": "44 / 42 %"}, {"label": "Další výplaty bez ORB", "sub": "dnes 63 / 61 %", "tone": "ok", "value": "64 / 69 %"}, {"label": "Průměr na účet (bootstrap)", "sub": "za 24 měsíců oproti dnešku", "tone": "gold", "value": "+$1 400 / +$2 100"}, {"label": "2010–17 (nezávislé)", "sub": "noise +2,4 / +2,8 bp vs +6,6 / +5,3 bp", "tone": "arc", "value": "edge ~poloviční"}]}, "eval": {"caption": "RS sprint (stop 0,30 %) + 09:31 (target 0,25 %) na dvou účtech · návrh", "fee": 90, "p": 0.5, "rules": [["Trh", "MNQ, 1min graf, indikátor Lucid 8"], ["Kontroly", "10:00, 11:00, 13:00, 14:30 ET (16:00, 17:00, 19:00, 20:30 Praha)"], ["Long", "NQ od otevření o víc než 0,15 % silnější než ES a cena nad VWAP"], ["Short", "zrcadlově: o 0,15 % slabší a pod VWAP"], ["Obchod", "jen první signál dne"], ["Target / stop", "+0,20 % / −0,40 % ceny, flat 15:55"], ["Velikost", "stop = max. ztráta 1 900 $ (~1 000 $ výhra)"], ["Pass", "3 výhry (nejlepší den ~1/3 zisku); prohra ukončí pokus"]], "tiles": [{"label": "Dva účty: dní do funded", "sub": "2018–21 / 2022–25", "tone": "ok", "value": "6,8 / 6,5"}, {"label": "Poplatky do funded", "sub": "oba účty dohromady", "tone": "gold", "value": "~$305"}, {"label": "Jeden účet RS 0,30 %", "sub": "poplatky ~185–200 $", "tone": "arc", "value": "~11 dní"}, {"label": "Dosavadní RS 0,40 %", "sub": "pass 48 / 52 %", "value": "~13 dní"}]}}, "stats": {"dataSets": 75}, "status": {"heartbeat": "2026-10-23T12:23:41Z", "phase": "working", "qc": "ok", "runs": 14, "shift": "2026-10-23 den", "sphere": "optimiser", "task": "Velikost a počet účtů: flat 3, škálovat kopiemi knihy na další funded účty."}}, "indicators": [{"chart": "MNQ · 5 min", "code": "// @version=5\nindicator(\"Lucid 1/3 — S1 ORB 15min Long\", overlay=true, max_labels_count=500, max_lines_count=50)\n\n// =========================================================================\n// S1: Opening Range Breakout 15-min, long-only, w/ 20-EMA trail\n// Entry : after 09:45 ET, close > OR_high AND close > session VWAP\n// SL    : max(OR_low, close - OR_range)\n// Trail : 20-EMA 5m (SL moves up to EMA, never down)\n// Exit  : SL hit or EOD 15:55 ET\n// Skip Wed. Re-enters after every exit; never two positions at once.\n// Same script on MNQ and MYM (Dow); the vol gate reads NQ on both.\n// Changed 2026-10-23 to match the backtest exactly: the 20-EMA trail runs on\n// RTH bars only and restarts each session; the stop is not tested on the\n// entry bar.\n// USE A 5-MINUTE CHART: the 20-EMA trail on a 1-minute chart exits and\n// re-enters ~20 times a day and loses after costs (2018-2025 test).\n// =========================================================================\n\nshowHist = input.bool(true, \"Show historical entries/exits\")\nema20Len = input.int(20, \"20-EMA trail length (chart TF)\")\nvolCeil  = input.float(0.30, \"Max 20d realised vol (skip day above this)\")\nvolSym   = input.string(\"CME_MINI:NQ1!\", \"Vol gate symbol (empty = this chart)\")\n\n// Volatility gate. Stops are set in points, so in the top volatility quintile\n// the same rule risks far more dollars per trade and the trailing drawdown\n// gets hit much sooner. Sitting out those days (about 17% of the sample)\n// raised portfolio pass rate by ~5pp and roughly halved the bust rate.\n// The gate always reads NQ, so on an MYM chart the Dow trades on exactly the\n// days NQ trades, as in the backtest.\n// Daily values: last COMPLETED session ([1] + lookahead_on), identical in history and\n// real time (lookahead_off would use the forming daily bar live). Fixed 2026-10-23.\ngateSym = volSym == \"\" ? syminfo.tickerid : volSym\ndRet = request.security(gateSym, \"D\", (close / close[1] - 1.0)[1], lookahead=barmerge.lookahead_on)\nrvol20 = request.security(gateSym, \"D\", (ta.stdev(close / close[1] - 1.0, 20) * math.sqrt(252))[1], lookahead=barmerge.lookahead_on)\nvolOK = na(rvol20) or rvol20 < volCeil\n\n// Session + DOW\nhET = hour(time, \"America/New_York\")\nmET = minute(time, \"America/New_York\")\netMin = hET * 60 + mET\ndowET = dayofweek(time, \"America/New_York\")\nisWed = dowET == dayofweek.wednesday\nrthFlag = not na(time(timeframe.period, \"0930-1600\", \"America/New_York\"))\n\n// RTH VWAP anchored\nrthStart = rthFlag and not nz(rthFlag[1], false)\nvwapVal = ta.vwap(hlc3, rthStart)\n\n// 20-EMA trail on RTH bars only, restarted each session (as in the backtest:\n// the exporter seeds it with the first RTH close and ignores overnight bars)\nvar float ema20 = na\nif rthStart\n    ema20 := close\nelse if rthFlag\n    ema20 := close * 2.0 / (ema20Len + 1) + nz(ema20, close) * (1.0 - 2.0 / (ema20Len + 1))\n\n// Build OR 9:30-9:45\nvar float orHigh = na\nvar float orLow  = na\nvar bool  orSet  = false\nif rthStart\n    orHigh := na\n    orLow := na\n    orSet := false\nif rthFlag and etMin >= 9*60+30 and etMin < 9*60+45\n    orHigh := na(orHigh) ? high : math.max(orHigh, high)\n    orLow  := na(orLow)  ? low  : math.min(orLow, low)\nif rthFlag and etMin >= 9*60+45 and not orSet\n    orSet := true\n\n// Trade state\nvar float sEntry = na\nvar float sSL    = na\nvar int   sBar   = na\nvar int   sDayId = na\ncurDayId = year*10000 + month*100 + dayofmonth\n\n// Re-entry is deliberate and load-bearing. Capping this at one trade per day\n// drops the strategy's standalone pass rate from 46% to 9%: later entries have\n// a markedly higher hit rate (37% on the first, 61% by the seventh) because by\n// then the trend is established. The only guard is that no two positions run\n// at once.\ntrigger = not isWed and volOK and rthFlag and orSet and etMin > 9*60+45 and etMin < 15*60 and close > orHigh and close > vwapVal and na(sEntry) and barstate.isconfirmed\nif trigger\n    orRange = orHigh - orLow\n    sl0 = math.max(orLow, close - orRange)\n    if sl0 < close\n        sEntry := close\n        sSL    := sl0\n        sBar   := bar_index\n        sDayId := curDayId\n\n// Exit management: trail + SL hit + EOD\nisEOD = etMin >= 15*60+55\ndayChg = ta.change(curDayId) != 0\n\n// The stop is tested against the stop as it stood before this bar, and only\n// then raised to the EMA, the same order as the backtest.\nif not na(sEntry) and bar_index > sBar      // the stop works from the bar after entry\n    exReason = \"\"\n    exPx = 0.0\n    if low <= sSL\n        exReason := \"SL\"\n        // a trailed stop above the market fills at the open, not at the stop\n        exPx := math.min(sSL, open)\n    else if isEOD or dayChg\n        exReason := \"EOD\"\n        exPx := close\n    else if ema20 > sSL\n        sSL := ema20\n    if exReason != \"\"\n        pnl = exPx - sEntry\n        if showHist\n            label.new(bar_index, exPx, \"S1 \" + exReason + \"\\n\" + str.tostring(pnl, \"+#.#\") + \"pt\", color=pnl >= 0 ? color.new(color.green, 20) : color.new(color.red, 20), textcolor=color.white, style=label.style_label_down, size=size.tiny)\n        sEntry := na\n        sSL := na\n\n// Entry marker (historical)\nplotshape(showHist and trigger, \"S1 entry\", shape.triangleup, location.belowbar, color=color.lime, size=size.small, text=\"S1\")\n\n// Live lines\nvar line eLn = na\nvar line slLn = na\nif barstate.islast\n    if not na(eLn)\n        line.delete(eLn)\n    if not na(slLn)\n        line.delete(slLn)\n    if not na(sEntry) and sDayId == curDayId\n        eLn := line.new(sBar, sEntry, bar_index + 20, sEntry, color=color.lime, width=2, extend=extend.right)\n        slLn := line.new(sBar, sSL, bar_index + 20, sSL, color=color.new(color.red, 20), style=line.style_dashed, extend=extend.right)\n\n// Reference plots\nplot(rthFlag ? vwapVal : na, \"VWAP (RTH)\", color=color.new(color.aqua, 30), linewidth=1)\nplot(ema20, \"20-EMA (trail)\", color=color.new(color.gray, 40))\nplot(rthFlag and orSet ? orHigh : na, \"OR High\", color=color.new(color.green, 10), linewidth=2, style=plot.style_linebr)\nplot(rthFlag and orSet ? orLow : na, \"OR Low\", color=color.new(color.red, 10), linewidth=2, style=plot.style_linebr)\n\n// Mini status badge\nvar table badge = table.new(position.top_right, 1, 3, border_width=1, bgcolor=color.new(color.black, 30))\nif barstate.islast\n    sessState = etMin < 570 ? \"PRE-OPEN\" : etMin < 585 ? \"BUILDING OR 9:30-9:45\" : etMin < 900 ? \"LIVE 9:45+ (watch entry)\" : etMin < 955 ? \"MID (still ok)\" : \"CLOSE SOON\"\n    sessCol = etMin >= 585 and etMin < 900 ? color.new(color.green, 20) : etMin >= 955 ? color.red : color.new(color.gray, 50)\n    table.cell(badge, 0, 0, \"S1 ORB 15m LONG\", bgcolor=color.new(color.lime, 50), text_color=color.white)\n    table.cell(badge, 0, 1, isWed ? \"WED — SKIP\" : not volOK ? \"VOL TOO HIGH — SKIP (\" + str.tostring(rvol20 * 100, \"#\") + \"%)\" : sessState, bgcolor=isWed or not volOK ? color.red : sessCol, text_color=color.white)\n    table.cell(badge, 0, 2, not na(sEntry) ? \"LIVE: entry \" + str.tostring(sEntry, format.mintick) : \"no position\", text_color=color.white, bgcolor=color.new(color.black, 50))\n", "extra": "Doporučení 23. 10.: NEPOUžÍVAT – bez edge ve všech obdobích 2010–25; bez ORB má první výplatu thStart = rthFlag and not nz(rthFlag[1], false)\nvw = ta.vwap(hlc3, rthStart)\n\nvar float e = na\nvar float tp = na\nvar float sl = na\nvar int cts = 0\nvar int dir = 0\nvar line eL = na\nvar line tL = na\nvar line sL = na\n\n// entry at the close of the 09:59 bar (10:00)\nif is1 and oMin == 599 and barstate.isconfirmed and na(e) and close != vw\n    dir := close > vw ? 1 : -1\n    e := close\n    tp := close * (1.0 + dir * tgtPct)\n    sl := close * (1.0 - dir * stpPct)\n    cts := math.min(maxCts, math.max(1, int(math.floor(maxLoss / (math.abs(e - sl) * ptValue)))))\n    eL := line.new(bar_index, e, bar_index + 30, e, color=color.yellow, width=2, extend=extend.right)\n    tL := line.new(bar_index, tp, bar_index + 30, tp, color=color.lime, width=2, extend=extend.right)\n    sL := line.new(bar_index, sl, bar_index + 30, sl, color=color.red, width=2, extend=extend.right)\n    label.new(bar_index, dir == 1 ? low : high, \"VWAP SPRINT \" + (dir == 1 ? \"LONG \" : \"SHORT \") + str.tostring(cts) + \" MNQ\\nwin $\" + str.tostring(cts * math.abs(tp - e) * ptValue, \"#\") + \" / loss $\" + str.tostring(cts * math.abs(e - sl) * ptValue, \"#\"), color=dir == 1 ? color.blue : color.purple, textcolor=color.white, style=dir == 1 ? label.style_label_up : label.style_label_down, size=size.normal)\n\n// exits from the next bar on; a bar touching both counts as the stop\nif not na(e) and not (oMin == 599)\n    rsn = \"\"\n    px = 0.0\n    if (dir == 1 and low <= sl) or (dir == -1 and high >= sl)\n        rsn := \"LOSS\"\n        px := dir == 1 ? math.min(sl, open) : math.max(sl, open)\n    else if (dir == 1 and high >= tp) or (dir == -1 and low <= tp)\n        rsn := \"WIN\"\n        px := dir == 1 ? math.max(tp, open) : math.min(tp, open)\n    else if cMin >= 955 or not rthFlag\n        rsn := \"EOD\"\n        px := close\n    if rsn != \"\"\n        usd = cts * dir * (px - e) * ptValue\n        line.set_x2(eL, bar_index)\n        line.set_x2(tL, bar_index)\n        line.set_x2( count=50)\n\n// =========================================================================\n// VWAP band break, both directions — USE A 5-MINUTE CHART\n// Entry : 5-min close breaks out of the RTH VWAP +/- 0.20% band (previous\n//         close inside, this close outside); not Wednesday; first trade only\n// SL    : 25 pt from entry (filled at the worse of stop and bar open)\n// TP    : 100 pt from entry\n// Exit  : SL/TP hit OR the 15:55 bar's close. One trade a day.\n//\n// Changed 2026-10-23: the old version traded a plain VWAP cross, which is not\n// what the book was tested on. Measured on NQ 2018-2025 with costs and the\n// vol gate: plain cross +2.3 / +0.7 pt per trade (2018-21 / 2022-25), this\n// band break +3.6 / +3.0 pt (live_spec_exporter, score_live_spec.py).\n// =========================================================================\n\nshowHist = input.bool(true, \"Show historical entries/exits\")\nbandPct  = input.float(0.20, \"Band around VWAP (%)\") / 100.0\nslPts    = input.float(25.0, \"Stop-loss (pt)\")\ntpPts    = input.float(100.0, \"Take-profit (pt)\")\nvolCeil  = input.float(0.30, \"Max 20d realised vol (skip day above this)\")\n\n// See lucid_1 for why this gate exists: point-denominated stops risk far more\n// dollars per trade in a high-volatility regime, and the trailing drawdown\n// arrives correspondingly sooner.\n// Daily values: last COMPLETED session ([1] + lookahead_on), identical in history and\n// real time (lookahead_off would use the forming daily bar live). Fixed 2026-10-23.\nrvol20 = request.security(syminfo.tickerid, \"D\", (ta.stdev(close / close[1] - 1.0, 20) * math.sqrt(252))[1], lookahead=barmerge.lookahead_on)\nvolOK = na(rvol20) or rvol20 < volCeil\n\n// Session + DOW\nhET = hour(time, \"America/New_York\")\nmET = minute(time, \"America/New_York\")\netMin = hET * 60 + mET\ndowET = dayofweek(time, \"America/New_York\")\nisWed = dowET == dayofweek.wednesday\nrthFlag = not na(time(timeframe.period, \"0930-1600\", \"America/New_York\"))\n\n// RTH VWAP anchored\nrthStart = rthFlag and not nz(rthFlag[1], false)\nvwapVal = ta.vwap(hlc3, rthStart)\n\n// Band-break signals (previous bar inside the band, this close outside)\nupB = vwapVal * (1.0 + bandPct)\nloB = vwapVal * (1.0 - bandPct)\nprevRth = nz(rthFlag[1], false) and not rthStart\nxUp = rthFlag and prevRth and close > upB and close[1] <= upB[1]\nxDn = rthFlag and prevRth and close < loB and close[1] >= loB[1]\nis5 = timeframe.period == \"5\"\n\n// Trade state\nvar float vEntry = na\nvar float vSL    = na\nvar float vTP    = na\nvar int   vDir   = na\nvar int   vBar   = na\nvar int   vDayId = na\nvar bool  vDone  = false\ncurDayId = year*10000 + month*100 + dayofmonth\ndayChg = ta.change(curDayId) != 0\nif dayChg\n    vDone := false\n\ncanTrade = is5 and not isWed and volOK and rthFlag and etMin < 15*60+50 and na(vEntry) and not vDone and barstate.isconfirmed\n\nif canTrade and xUp\n    vEntry := close\n    vDir   := 1\n    vSL    := close - slPts\n    vTP    := close + tpPts\n    vBar   := bar_index\n    vDayId := curDayId\nif canTrade and xDn\n    vEntry := close\n    vDir   := -1\n    vSL    := close + slPts\n    vTP    := close - tpPts\n    vBar   := bar_index\n    vDayId := curDayId\n\n// Exit management\nisEOD = etMin >= 15*60+55\nif not na(vEntry) and bar_index > vBar      // stop/target work from the bar after entry\n    exReason = \"\"\n    exPx = 0.0\n    if vDir == 1\n        if low <= vSL\n            exReason := \"SL\"\n            exPx := math.min(vSL, open)\n        else if high >= vTP\n            exReason := \"TP\"\n            exPx := vTP\n        else if isEOD or dayChg\n            exReason := \"EOD\"\n            exPx := close\n    else\n        if high >= vSL\n            exReason := \"SL\"\n            exPx := math.max(vSL, open)\n        else if low <= vTP\n            exReason := \"TP\"\n            exPx := vTP\n        else if isEOD or dayChg\n            exReason := \"EOD\"\n            exPx := close\n    if exReason != \"\"\n        pnl = vDir * (exPx - vEntry)\n        if showHist\n            label.new(bar_index, exPx, \"VWAP \" + exReason + \"\\n\" + str.tostring(pnl, \"+#.#\") + \"pt\", color=pnl >= 0 ? color.new(color.green, 20) : color.new(color.red, 20), textcolor=color.white, style=label.style_label_down, size=size.tiny)\n        vEntry := na\n        vSL := na\n        vTP := na\n        vDir := na\n        vDone := true\n\n// Entry markers (historical)\nplotshape(showHist and xUp and not isWed, \"VWAP long\", shape.triangleup, location.belowbar, color=color.aqua, size=size.small, text=\"VL\")\nplotshape(showHist and xDn and not isWed, \"VWAP short\", shape.triangledown, location.abovebar, color=color.fuchsia, size=size.small, text=\"VS\")\n\n// Live lines\nvar line veLn = na\nvar line vslLn = na\nvar line vtpLn = na\nif barstate.islast\n    if not na(veLn)\n        line.delete(veLn)\n    if not na(vslLn)\n        line.delete(vslLn)\n    if not na(vtpLn)\n        line.delete(vtpLn)\n    if not na(vEntry) and vDayId == curDayId\n        clrDir = vDir == 1 ? color.aqua : color.fuchsia\n        veLn := line.new(vBar, vEntry, bar_index + 20, vEntry, color=clrDir, width=2, extend=extend.right)\n        vslLn := line.new(vBar, vSL, bar_index + 20, vSL, color=color.new(color.red, 20), style=line.style_dashed, extend=extend.right)\n        vtpLn := line.new(vBar, vTP, bar_index + 20, vTP, color=color.new(color.green, 20), style=line.style_dashed, extend=extend.right)\n\n// Reference plots\nplot(rthFlag ? vwapVal : na, \"VWAP (RTH)\", color=color.new(color.yellow, 20), linewidth=2)\nplot(rthFlag ? upB : na, \"upper band\", color=color.new(color.aqua, 40))\nplot(rthFlag ? loB : na, \"lower band\", color=color.new(color.fuchsia, 40))\n\n// Mini status badge\nvar table badgeV = table.new(position.top_right, 1, 3, border_width=1, bgcolor=color.new(color.black, 30))\nif barstate.islast\n    sessStateV = etMin < 570 ? \"PRE-OPEN\" : etMin < 955 ? \"LIVE (watch cross)\" : \"CLOSE SOON\"\n    sessColV = etMin >= 570 and etMin < 955 ? color.new(color.aqua, 30) : color.new(color.gray, 50)\n    table.cell(badgeV, 0, 0, is5 ? \"VWAP BAND\" : \"VWAP BAND: use a 5-minute chart\", bgcolor=is5 ? color.new(color.yellow, 50) : color.red, text_color=color.white)\n    table.cell(badgeV, 0, 1, isWed ? \"WED — SKIP\" : vDone ? \"DONE TODAY\" : sessStateV, bgcolor=isWed ? color.red : vDone ? color.new(color.gray, 30) : sessColV, text_color=color.white)\n    table.cell(badgeV, 0, 2, not na(vEntry) ? \"LIVE \" + (vDir==1?\"L \":\"S \") + str.tostring(vEntry, format.mintick) : \"no position\", text_color=color.white, bgcolor=color.new(color.black, 50))\n", "file": "lucid_2_vwap.pine", "group": "funded", "name": "Lucid 2 — VWAP Band", "note": "nahrát novou verzi: průraz pásma 0,20 %, 1× denně, filtr volatility z dokončeného dne", "order": 3, "result": "+3,6 / +3,0 b. na obchod (2018–21 / 2022–25)", "role": "funded kniha", "settings": [["Velikost", "3 MNQ"], ["SL / TP", "25 / 100 b."]], "slot": "Funded", "status": "live", "_id": "i2"}, {"chart": "–", "file": "lucid_3_monfri.pine", "name": "Lucid 3 — Mon/Fri", "order": 7, "role": "vyřazeno z plánu", "status": "off", "_id": "i3"}, {"chart": "–", "file": "lucid_4_coc.pine", "name": "Lucid 4 — COC", "order": 8, "role": "mimo plán", "status": "off", "_id": "i4"}, {"chart": "1 min", "file": "lucid_5_fomc_fade.pine", "name": "Lucid 5 — FOMC Fade", "order": 6, "role": "kandidát, 8× ročně", "status": "off", "_id": "i5"}, {"chart": "1 / 5 / 30 min", "code": "// @version=5\nindicator(\"Lucid 6 — Noise Area Momentum\", overlay=true, max_labels_count=500, max_lines_count=500)\n\n// Zarattini, Aziz & Barbon (2024), \"Beat the Market\", on NQ. Long and short.\n// sigma(t) = average over the last 14 sessions of |price at time t / 09:30\n// open - 1|. Upper band = max(open, prior close) x (1 + sigma), lower band =\n// min(open, prior close) x (1 - sigma). Decisions only at :00 and :30 from\n// 10:00 to 15:30 ET: long when the close is above the upper band, short when\n// below the lower band. A long exits when the close is below max(upper band,\n// VWAP), a short when above min(lower band, VWAP); an opposite signal\n// reverses. Flat at 15:55. Use a 1-, 5- or 30-minute chart.\n// Hard stop (added 2026-10-23): exit when price moves 0.50% against the entry\n// (filled at the worse of the stop and the bar open). Same edge, worst trade\n// about -125 pt instead of -220 pt.\n//\n// NQ 2018-2025, $1 cost per MNQ: about 1 trade a day, 38% winners, +6.1 pt\n// per trade 2018-2021 and +9.2 pt 2022-2025 with the hard stop (+5.5 / +9.4\n// without it).\n\nlookback = input.int(14, \"Sessions for the noise average\")\nuseVol   = input.bool(true, \"Volatility gate (skip if NQ 20d vol >= ceiling)\")\nvolCeil  = input.float(0.30, \"   vol ceiling\")\nvolSym   = input.string(\"CME_MINI:NQ1!\", \"   vol gate symbol\")\nhardStop = input.float(0.50, \"Hard stop (% from entry, 0 = off)\") / 100.0\n// Daily values: last COMPLETED session ([1] + lookahead_on), identical in history and\n// real time (lookahead_off would use the forming daily bar live). Fixed 2026-10-23.\n\nrvol20 = request.security(volSym, \"D\", (ta.stdev(close / close[1] - 1.0, 20) * math.sqrt(252))[1], lookahead=barmerge.lookahead_on)\nvolOK = not useVol or na(rvol20) or rvol20 < volCeil\n\noMin = hour(time, \"America/New_York\") * 60 + minute(time, \"America/New_York\")\ncMin = hour(time_close, \"America/New_York\") * 60 + minute(time_close, \"America/New_York\")\ntfOK = timeframe.isintraday and timeframe.multiplier <= 30 and 30 % timeframe.multiplier == 0\n\nvar float dOpen = na\nvar float pClose = na\nvar float lastClose = na\nvar int ghost = 0      // direction of a stopped trade until its normal exit\nvar float pv = 0.0\nvar float vv = 0.0\nif oMin == 570\n    pClose := lastClose\n    dOpen := open\n    ghost := 0\n    pv := 0.0\n    vv := 0.0\ninRth = cMin > 570 and cMin <= 960 and not na(dOpen)\nif inRth\n    pv += hlc3 * volume\n    vv += volume\nvw = vv > 0 ? pv / vv : na\nif cMin == 960\n    lastClose := close\n\nvar array<float> buf = array.new<float>(12 * lookback, na)\nvar array<int> cnt = array.new<int>(12, 0)\nvar float ub = na\nvar float lb = na\nvar int pos = 0\nvar float ent = na\nvar int entBar = na\n\n// hard stop, checked on every bar after the entry bar\nstopLvl = pos != 0 and hardStop > 0 ? ent * (1.0 - pos * hardStop) : na\nif pos != 0 and hardStop > 0 and bar_index > entBar and inRth\n    hit = pos == 1 ? low <= stopLvl : high >= stopLvl\n    if hit\n        px = pos == 1 ? math.min(stopLvl, open) : math.max(stopLvl, open)\n        pnl = pos * (px - ent)\n        label.new(bar_index, px, \"NZ STOP \" + str.tostring(pnl, \"+#.##\"), color=color.red, textcolor=color.white, style=label.style_label_down, size=size.small)\n        ghost := pos         // no new entry until the stopped trade's normal exit, as in the backtest\n        pos := 0\n        ent := na\n\nisCheck = tfOK and inRth and cMin >= 600 and cMin <= 930 and cMin % 30 == 0 and barstate.isconfirmed\nif isCheck\n    idx = int((cMin - 600) / 30)\n    n = array.get(cnt, idx)\n    sigma = 0.0\n    if n >= lookback\n        s = 0.0\n        for k = 0 to lookback - 1\n            s += array.get(buf, idx * lookback + k)\n        sigma := s / lookback\n    array.set(buf, idx * lookback + n % lookback, math.abs(close / dOpen - 1.0))\n    array.set(cnt, idx, n + 1)\n    if n >= lookback and not na(pClose)\n        ub := math.max(dOpen, pClose) * (1.0 + sigma)\n        lb := math.min(dOpen, pClose) * (1.0 - sigma)\n        sig = close > ub ? 1 : close < lb ? -1 : 0\n        if pos != 0 or ghost != 0\n            d = pos != 0 ? pos : ghost\n            out = d == 1 ? close < math.max(ub, vw) : close > math.min(lb, vw)\n            if out or (sig != 0 and sig != d)\n                if pos != 0\n                    pnl = pos * (close - ent)\n                    label.new(bar_index, close, \"NZ EXIT \" + str.tostring(pnl, \"+#.##\"), color=pnl >= 0 ? color.green : color.red, textcolor=color.white, style=label.style_label_down, size=size.small)\n                pos := 0\n                ent := na\n                ghost := 0\n        if pos == 0 and ghost == 0 and sig != 0 and volOK\n            pos := sig\n            ent := close\n            entBar := bar_index\n            label.new(bar_index, close, sig == 1 ? \"NZ LONG\" : \"NZ SHORT\", color=sig == 1 ? color.green : color.red, textcolor=color.white, style=sig == 1 ? label.style_label_up : label.style_label_down, size=size.normal)\n\nif pos != 0 and tfOK and cMin >= 955 and cMin <= 960 and barstate.isconfirmed\n    pnl = pos * (close - ent)\n    label.new(bar_index, close, \"NZ EOD \" + str.tostring(pnl, \"+#.##\"), color=pnl >= 0 ? color.green : color.red, textcolor=color.white, style=label.style_label_down, size=size.small)\n    pos := 0\n    ent := na\nif cMin >= 955\n    ghost := 0\n\nplot(inRth ? ub : na, \"upper band\", color=color.new(color.green, 30), style=plot.style_stepline)\nplot(inRth ? lb : na, \"lower band\", color=color.new(color.red, 30), style=plot.style_stepline)\nplot(inRth ? vw : na, \"VWAP\", color=color.new(color.aqua, 30))\nplot(pos != 0 ? ent : na, \"entry\", color=color.yellow, style=plot.style_linebr, linewidth=2)\nplot(pos != 0 and hardStop > 0 ? ent * (1.0 - pos * hardStop) : na, \"hard stop\", color=color.red, style=plot.style_linebr, linewidth=2)\n// Where the next :00/:30 check would close the position (it is a close-of-\n// bar exit at the check, not a resting stop order).\nexitLvl = pos == 1 ? math.max(ub, vw) : pos == -1 ? math.min(lb, vw) : na\nplot(inRth ? exitLvl : na, \"exit level\", color=color.new(color.orange, 0), style=plot.style_linebr, linewidth=2)\n\nvar table tb = table.new(position.top_right, 1, 1, bgcolor=color.new(color.black, 30))\nif barstate.islast\n    msg = not tfOK ? \"NOISE MOMENTUM: use a 1/5/30-minute chart\" : not volOK ? \"VOL TOO HIGH — no new trades\" : pos == 1 ? \"LONG from \" + str.tostring(ent, format.mintick) : pos == -1 ? \"SHORT from \" + str.tostring(ent, format.mintick) : \"flat — next check at :00/:30\"\n    table.cell(tb, 0, 0, msg, text_color=color.white, bgcolor=not tfOK or not volOK ? color.red : pos != 0 ? color.new(color.orange, 20) : color.new(color.gray, 50))\n", "file": "lucid_6_noise_momentum.pine", "group": "funded", "name": "Lucid 6 — Noise Momentum", "note": "nahrát novou verzi: pevný stop 0,50 %, filtr volatility z dokončeného dne", "order": 4, "result": "+5,7 / +8,7 b. na obchod", "role": "funded kniha", "settings": [["Velikost", "3 MNQ"], ["Hard stop", "0,50 %"]], "slot": "Funded", "status": "live", "_id": "i6"}, {"chart": "MNQ · 1 min", "code": "// @version=5\nindicator(\"Lucid 7 — Eval Sprint\", overlay=true, max_labels_count=500, max_lines_count=500)\n\n// Evaluation sprint: one NQ trade a day at the close of the first RTH\n// minute (09:30-09:31 ET), target +0.20% of price, stop -0.40%, otherwise\n// flat at 15:55. Size so the stop costs at most \"Max loss\"; with $1,900 that\n// is a ~$950-1,000 win, so three winning days reach +$3,000 with the best day\n// about a third of the profit (50% consistency rule). One losing day ends the\n// attempt. NQ 2018-2025 with costs: ~35% of attempts pass, ~5 trading days\n// per attempt. Use a 1-minute MNQ chart.\n// Bias \"Auto\": long when NQ's prior daily close is above its 50-day average,\n// short when below. Tested 2018-2025: pass per attempt 39% vs 36% always long,\n// in both 2018-21 and 2022-25 (a small but consistent gain).\n\nmaxLoss  = input.float(1900.0, \"Max loss per trade ($)\")\ntgtPct   = input.float(0.20, \"Target (% of price)\") / 100.0\nstpPct   = input.float(0.40, \"Stop (% of price)\") / 100.0\nptValue  = input.float(2.0, \"$ per point per contract (MNQ = 2)\")\nmaxCts   = input.int(40, \"Max contracts\")\nbiasMode = input.string(\"Auto (50-day trend)\", \"Bias\", options=[\"Auto (50-day trend)\", \"Long\", \"Short\"])\nuseVol   = input.bool(true, \"Volatility gate (skip if NQ 20d vol >= 30%)\")\nvolSym   = input.string(\"CME_MINI:NQ1!\", \"   vol gate symbol\")\n// Daily values: last COMPLETED session ([1] + lookahead_on), identical in history and\n// real time (lookahead_off would use the forming daily bar live). Fixed 2026-10-23.\n\nrvol20 = request.security(volSym, \"D\", (ta.stdev(close / close[1] - 1.0, 20) * math.sqrt(252))[1], lookahead=barmerge.lookahead_on)\nvolOK = not useVol or na(rvol20) or rvol20 < 0.30\ndClose = request.security(volSym, \"D\", (close)[1], lookahead=barmerge.lookahead_on)\ndSma50 = request.security(volSym, \"D\", (ta.sma(close, 50))[1], lookahead=barmerge.lookahead_on)\nbias = biasMode == \"Long\" ? 1 : biasMode == \"Short\" ? -1 : (dClose > dSma50 ? 1 : -1)\n\noMin = hour(time, \"America/New_York\") * 60 + minute(time, \"America/New_York\")\ncMin = hour(time_close, \"America/New_York\") * 60 + minute(time_close, \"America/New_York\")\nis1 = timeframe.period == \"1\"\n\nvar float e = na\nvar float tp = na\nvar float sl = na\nvar int cts = 0\nvar int dir = 0\nvar line eL = na\nvar line tL = na\nvar line sL = na\n\n// entry at the close of the 09:30 bar\nif is1 and oMin == 570 and barstate.isconfirmed and na(e) and volOK\n    dir := bias\n    e := close\n    tp := close * (1.0 + dir * tgtPct)\n    sl := close * (1.0 - dir * stpPct)\n    cts := math.min(maxCts, math.max(1, int(math.floor(maxLoss / (math.abs(e - sl) * ptValue)))))\n    eL := line.new(bar_index, e, bar_index + 30, e, color=color.yellow, width=2, extend=extend.right)\n    tL := line.new(bar_index, tp, bar_index + 30, tp, color=color.lime, width=2, extend=extend.right)\n    sL := line.new(bar_index, sl, bar_index + 30, sl, color=color.red, width=2, extend=extend.right)\n    label.new(bar_index, dir == 1 ? low : high, \"SPRINT \" + (dir == 1 ? \"LONG \" : \"SHORT \") + str.tostring(cts) + \" MNQ\\nwin $\" + str.tostring(cts * math.abs(tp - e) * ptValue, \"#\") + \" / loss $\" + str.tostring(cts * math.abs(e - sl) * ptValue, \"#\"), color=dir == 1 ? color.blue : color.purple, textcolor=color.white, style=dir == 1 ? label.style_label_up : label.style_label_down, size=size.normal)\n\n// exits from the next bar on; a bar touching both counts as the stop\nif not na(e) and not (oMin == 570)\n    rsn = \"\"\n    px = 0.0\n    if (dir == 1 and low <= sl) or (dir == -1 and high >= sl)\n        rsn := \"LOSS\"\n        px := dir == 1 ? math.min(sl, open) : math.max(sl, open)\n    else if (dir == 1 and high >= tp) or (dir == -1 and low <= tp)\n        rsn := \"WIN\"\n        px := dir == 1 ? math.max(tp, open) : math.min(tp, open)\n    else if cMin >= 955\n        rsn := \"EOD\"\n        px := close\n    if rsn != \"\"\n        usd = cts * dir * (px - e) * ptValue\n        line.set_x2(eL, bar_index)\n        line.set_x2(tL, bar_index)\n        line.set_x2(sL, bar_index)\n        line.set_extend(eL, extend.none)\n        line.set_extend(tL, extend.none)\n        line.set_extend(sL, extend.none)\n        label.new(bar_index, px, \"SPRINT \" + rsn + \"\\n\" + (usd >= 0 ? \"+$\" : \"-$\") + str.tostring(math.abs(usd), \"#\"), color=usd >= 0 ? color.green : color.red, textcolor=color.white, style=label.style_label_down, size=size.small)\n        e := na\n\nvar table tb = table.new(position.top_right, 1, 1, bgcolor=color.new(color.black, 30))\nif barstate.islast\n    msg = not is1 ? \"EVAL SPRINT: use a 1-minute chart\" : not volOK ? \"VOL TOO HIGH — no sprint today\" : not na(e) ? \"IN TRADE: \" + (dir == 1 ? \"LONG \" : \"SHORT \") + str.tostring(cts) + \" MNQ  TP \" + str.tostring(tp, format.mintick) + \"  SL \" + str.tostring(sl, format.mintick) : \"next: \" + (bias == 1 ? \"LONG\" : \"SHORT\") + \" at the close of the 09:30 bar\"\n    table.cell(tb, 0, 0, msg, text_color=color.white, bgcolor=not is1 or not volOK ? color.red : not na(e) ? color.new(color.orange, 20) : color.new(color.gray, 50))\n", "file": "lucid_7_eval_sprint.pine", "group": "eval", "name": "Lucid 7 — Eval Sprint 09:31", "note": "nahrát novou verzi: bias a filtr z posledního dokončeného dne; návrh Target 0,25 %, filtr volatility VYPNOUT", "order": 2, "result": "~11 obchodních dní do passu · s účtem A první funded za ~7 dní", "role": "evaluace – účet B", "settings": [["Target", "0,25 %"], ["Stop", "0,40 %"], ["Volatility gate", "vypnout"], ["Max loss", "1 900 $"]], "slot": "Účet B", "status": "live", "_id": "i7"}, {"chart": "MNQ · 1 min", "code": "// @version=5\nindicator(\"Lucid 8 — RS Sprint\", overlay=true, max_labels_count=500, max_lines_count=500)\n\n// Evaluation sprint on relative strength. At 10:00, 11:00, 13:00 and 14:30 ET\n// (close of the bar ending then), the first time that\n//   NQ return since the 09:30 open - ES return since the open > +0.15%\n//   and price is above the session VWAP           -> LONG\n//   the difference is below -0.15% and price is below VWAP -> SHORT\n// one trade is taken: target 0.20% of price, stop 0.40%, flat at 15:55.\n// Size so the stop costs at most \"Max loss\" (~$1,000 win at $1,900).\n// Three wins pass (best day ~1/3 of profit); one loss ends the attempt.\n// NQ 2018-2025 with costs: 48% (2018-21) / 52% (2022-25) of attempts pass,\n// ~13 trading days to a pass on average, vs 36% for the plain 09:31 long.\n// Use a 1-minute MNQ chart.\n\nmaxLoss = input.float(1900.0, \"Max loss per trade ($)\")\nrsThr   = input.float(0.15, \"Relative strength threshold (%)\") / 100.0\ntgtPct  = input.float(0.20, \"Target (% of price)\") / 100.0\nstpPct  = input.float(0.40, \"Stop (% of price)\") / 100.0\nptValue = input.float(2.0, \"$ per point per contract (MNQ = 2)\")\nmaxCts  = input.int(40, \"Max contracts\")\nesSym   = input.string(\"CME_MINI:ES1!\", \"ES symbol\")\n\nesC = request.security(esSym, timeframe.period, close, lookahead=barmerge.lookahead_off)\nesO = request.security(esSym, timeframe.period, open, lookahead=barmerge.lookahead_off)\n\noMin = hour(time, \"America/New_York\") * 60 + minute(time, \"America/New_York\")\ncMin = hour(time_clo     for (let i = 0; i < 3200; i++) {
      const [dx, dy, dz] = unit();
      // gyri: keep dots on the ridges of a folded pattern, leave the sulci empty
      const g = Math.sin(dz * 15 + dy * 9 + side * 1.3) * Math.cos(dy * 13 - dx * 8) + 0.6 * Math.sin(dx * 21 + dz * 12 - dy * 5);
      if (g < -0.15) continue;
      const fold = 1 + 0.035 * g;
      let x = side * 0.36 + dx * 0.44 * fold, y = 0.06 + dy * 0.5 * fold, z = dz * 0.8 * fold;
      if (side * x < 0.05) continue;
      if (y < -0.2) y = -0.2 + (y + 0.2) * 0.5;
      if (z > 0.35 && y < -0.05) y = -0.05 + (y + 0.05) * 0.6;
      pts.push([x, y, z, 0]);
    }
  }
  for (let i = 0; i < 420; i++) {
    const [dx, dy, dz] = unit(), f = 1 + 0.06 * Math.sin(dy * 38);
    if (dz > 0.55) continue;
    pts.push([dx * 0.46 * f, -0.36 + dy * 0.17 * f, -0.6 + dz * 0.24 * f, 1]);
  }
  for (let i = 0; i < 140; i++) {
    const a = rnd() * Math.PI * 2, t = rnd();
    pts.push([Math.cos(a) * 0.085, -0.25 - t * 0.6, -0.3 + Math.sin(a) * 0.085 + t * 0.06, 2]);
  }
  function size() {
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function proj(p) {
    const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
    let x = p[0] * cy - p[2] * sy, z = p[0] * sy + p[2] * cy;
    let y = p[1] * cx - z * sx; z = p[1] * sx + z * cx;
    const R = Math.min(W * 0.46, H * 0.5), f = 3.2 / (3.2 - z);
    return [W / 2 + x * R * f, H * 0.5 - y * R * f, z, f];
  }
  let dotRGB = "", fgCol = "", cardCol = "";
  function readColors() { const cs = getComputedStyle(document.documentElement); dotRGB = cs.getPropertyValue("--dot").trim(); fgCol = cs.getPropertyValue("--fg").trim(); cardCol = cs.getPropertyValue("--card").trim(); }
  readColors();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); });
  function draw(t) {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const q = proj(p), a = 0.16 + 0.5 * Math.max(0, Math.min(1, (q[2] + 0.9) / 1.8));
      ctx.fillStyle = `rgba(${dotRGB},${a.toFixed(3)})`;
      const s = (p[3] === 1 ? 1.5 : 1.7) * q[3];
      ctx.fillRect(q[0] - s / 2, q[1] - s / 2, s, s);
    }
    const act = activeId();
    const nodes = AGENTS.map((a) => ({ a, q: proj(a.pos) })).sort((x, y) => x.q[2] - y.q[2]);
    ctx.font = "600 12px Manrope, system-ui, sans-serif"; ctx.textBaseline = "middle";
    for (const { a, q } of nodes) {
      const front = q[2] > -0.25, isSel = a.id === sel, isHov = hover === a.id;
      const r = (isSel ? 10 : isHov ? 9 : 7.5) * q[3];
      ctx.globalAlpha = front ? 1 : 0.45;
      if (a.id === act) {
        const ph = reduced ? 0.5 : (t / 1400) % 1;
        ctx.strokeStyle = a.color; ctx.lineWidth = 2; ctx.globalAlpha = (front ? 1 : 0.45) * (1 - ph);
        ctx.beginPath(); ctx.arc(q[0], q[1], r + 4 + ph * 16, 0, 7); ctx.stroke();
        ctx.globalAlpha = front ? 1 : 0.45;
      }
      if (isSel) { ctx.fillStyle = a.color; ctx.globalAlpha *= 0.18; ctx.beginPath(); ctx.arc(q[0], q[1], r + 7, 0, 7); ctx.fill(); ctx.globalAlpha = front ? 1 : 0.45; }
      ctx.fillStyle = a.color; ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 7); ctx.fill();
      ctx.strokeStyle = cardCol; ctx.lineWidth = 2; ctx.stroke();
      const label = a.name, tw = ctx.measureText(label).width;
      let lx = q[0] + r + 7;
      if (lx + tw > W - 4) lx = q[0] - r - 7 - tw;
      ctx.fillStyle = cardCol; ctx.globalAlpha = (front ? 0.85 : 0.35);
      ctx.fillRect(lx - 3, q[1] - 9, tw + 6, 18);
      ctx.globalAlpha = front ? 1 : 0.45; ctx.fillStyle = fgCol; ctx.fillText(label, lx, q[1] + 0.5);
      a.sx = q[0]; a.sy = q[1]; a.lx = lx; a.lw = tw;
      ctx.globalAlpha = 1;
    }
    if (!drag) {
      rotY += vY; rotX = Math.max(-0.75, Math.min(0.75, rotX + vX)); vY *= 0.94; vX *= 0.94;
      if (!reduced && Math.abs(vY) < 0.0015) rotY += 0.0022;
    }
  }
  function hit(x, y) {
    let best = null, bd = 22;
    for (const a of AGENTS) {
      if (a.sx == null) continue;
      const d = Math.hypot(a.sx - x, a.sy - y);
      const onLabel = x > a.lx - 3 && x < a.lx + a.lw + 3 && Math.abs(y - a.sy) < 10;
      if (onLabel) return a;
      if (d < bd) { bd = d; best = a; }
    }
    return best;
  }
  const loc = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY }; moved = 0; vX = vY = 0; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
  cv.addEventListener("pointermove", (e) => {
    if (drag) {
      const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
      rotY += dx * 0.009; rotX = Math.max(-0.75, Math.min(0.75, rotX + dy * 0.009));
      vY = dx * 0.009; vX = dy * 0.009; drag.lx = e.clientX; drag.ly = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      if (reduced) draw(0);
      return;
    }
    const [x, y] = loc(e), a = hit(x, y);
    hover = a ? a.id : null; cv.style.cursor = a ? "pointer" : "grab";
    if (reduced) draw(0);
  });
  cv.addEventListener("pointerup", (e) => {
    const wasClick = drag && moved < 6; drag = null; cv.style.cursor = "grab";
    if (wasClick) { const [x, y] = loc(e), a = hit(x, y); if (a) pick(a.id); }
    if (reduced) { vX = vY = 0; draw(0); }
  });
  cv.addEventListener("pointerleave", () => { hover = null; });
  new ResizeObserver(() => { size(); draw(performance.now()); }).observe(cv);
  function loop(t) { draw(t); requestAnimationFrame(loop); }

  function refresh() { renderTop(); renderChips(); renderAgent(); renderStrats(); }
  refresh();
  setInterval(renderTop, 30000);
  requestAnimationFrame(loop);

  // ---------- offline snapshot (jarvis_offline.html carries window.JARVIS_SNAPSHOT) ----------
  function loadSnapshot() {
    const X = window.JARVIS_SNAPSHOT;
    if (!X) return false;
    const by = (a, k, dir) => [...(a || [])].sort((x, y) => (x[k] > y[k] ? 1 : -1) * (dir === "desc" ? -1 : 1));
    const b = X.brain || {};
    Object.assign(S, { status: b.status || null, metrics: b.metrics || null, stats: b.stats || null, account: b.account || null,
      log: b.log && Array.isArray(b.log.events) ? b.log.events : [], queue: by(X.queue, "order"), strategies: by(X.strategies, "order"),
      reports: by(X.reports, "date", "desc"), indicators: by(X.indicators, "order"), db: "snap", taken: X.taken || null });
    refresh();
    return true;
  }

  // ---------- live data ----------
  const docs = (snap) => snap.docs.map((d) => Object.assign({ _id: d.id }, d.data()));
  (async () => {
    const db = window.claude ? await window.claude.use("db") : null;
    if (!db) { if (!loadSnapshot()) { S.db = "off"; refresh(); } return; }
    S.db = "on"; refresh();
    const fail = () => { S.db = "off"; refresh(); };
    const one = (path, key) => db.doc(path).onSnapshot((s) => { S[key] = s.exists ? s.data() : null; refresh(); }, fail);
    one("brain/status", "status");
    one("brain/metrics", "metrics");
    one("brain/stats", "stats");
    one("brain/account", "account");
    db.doc("brain/log").onSnapshot((s) => { const d = s.exists ? s.data() : null; S.log = d && Array.isArray(d.events) ? d.events : []; renderAgent(); }, fail);
    db.collection("queue").orderBy("order").onSnapshot((s) => { S.queue = docs(s); renderAgent(); }, fail);
    db.collection("strategies").orderBy("order").onSnapshot((s) => { S.strategies = docs(s); renderAgent(); }, fail);
    db.collection("reports").orderBy("date", "desc").limit(5).onSnapshot((s) => { S.reports = docs(s); renderAgent(); }, fail);
    db.collection("indicators").orderBy("order").onSnapshot((s) => { S.indicators = docs(s); renderAgent(); renderStrats(); }, fail);
  })();
})();
</script>
