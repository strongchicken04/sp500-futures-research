<style>
/* Mozek: one screen. Rotatable 3D brain with the six agents, the picked agent's
   card beside it, then the final strategies (evaluation, funded) with copyable
   Pine code. Clean light dashboard, dark mode follows the system. */
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --card2: #f8f9fb;
  --line: #e4e7ec;
  --fg: #111827;
  --muted: #5b6474;
  --faint: #8a93a3;
  --accent: #2e6be6;
  --accent-soft: #e8effd;
  --on-accent: #ffffff;
  --ok: #12936b;
  --ok-soft: #e3f5ee;
  --warn: #b7791f;
  --warn-soft: #fbf1df;
  --bad: #d23f57;
  --bad-soft: #fbe7ea;
  --dot: 92, 104, 128;
  --code-bg: #f6f7f9;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
  --f: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --card: #151a22; --card2: #1a2029; --line: #262d38; --fg: #e8ebf0; --muted: #a2abba; --faint: #6f7888;
    --accent: #6f9cff; --accent-soft: rgba(111, 156, 255, 0.14); --on-accent: #0d1117; --ok: #3ccf9a; --ok-soft: rgba(60, 207, 154, 0.13);
    --warn: #f0b552; --warn-soft: rgba(240, 181, 82, 0.13); --bad: #ff6f86; --bad-soft: rgba(255, 111, 134, 0.13);
    --dot: 170, 182, 204; --code-bg: #10141b; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --card: #151a22; --card2: #1a2029; --line: #262d38; --fg: #e8ebf0; --muted: #a2abba; --faint: #6f7888;
  --accent: #6f9cff; --accent-soft: rgba(111, 156, 255, 0.14); --on-accent: #0d1117; --ok: #3ccf9a; --ok-soft: rgba(60, 207, 154, 0.13);
  --warn: #f0b552; --warn-soft: rgba(240, 181, 82, 0.13); --bad: #ff6f86; --bad-soft: rgba(255, 111, 134, 0.13);
  --dot: 170, 182, 204; --code-bg: #10141b; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 14px; line-height: 1.5;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1240px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: var(--f); }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 18px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
.logo svg { width: 18px; height: 18px; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.brand small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: -2px; }
.top .sp { flex: 1; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; color: var(--muted); white-space: nowrap; box-shadow: var(--shadow); }
.pill b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pill.ok i { background: var(--ok); } .pill.warn i { background: var(--warn); } .pill.bad i { background: var(--bad); }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.brain { position: relative; padding: 14px 14px 12px; display: flex; flex-direction: column; }
.brain .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--muted); }
.brain .hd b { color: var(--fg); font-size: 14px; }
.stage { position: relative; height: clamp(300px, 46vw, 430px); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.chips button i { width: 9px; height: 9px; border-radius: 50%; }
.chips button:hover { color: var(--fg); }
.chips button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
.chips button .live { font-size: 10.5px; color: var(--ok); font-weight: 700; }

/* agent panel */
.agent { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.agent .ah { display: flex; align-items: center; gap: 12px; }
.agent .dotbig { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 4px var(--card2); }
.agent h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.agent .role { color: var(--muted); font-size: 13px; }
.agent .state { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--card2); color: var(--muted); white-space: nowrap; }
.agent .state.on { background: var(--ok-soft); color: var(--ok); }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
.now { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.now small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .sub { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; margin-top: -2px; }
.kv li { grid-template-columns: minmax(110px, 0.8fr) minmax(0, 1.6fr); }
.kv li span:first-child { color: var(--muted); }
.steps li { grid-template-columns: 46px minmax(0, 1fr); }
.steps time { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.tag { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: var(--card2); color: var(--muted); white-space: nowrap; align-self: start; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.acc { background: var(--accent-soft); color: var(--accent); }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.num { background: var(--card2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.num .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; overflow-wrap: anywhere; line-height: 1.25; }
.num .l { font-size: 12px; color: var(--muted); }
.num .s { font-size: 11.5px; color: var(--faint); }
.num.ok .v { color: var(--ok); } .num.bad .v { color: var(--bad); } .num.gold .v { color: var(--warn); }
.todo { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; }
details.more summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
details.more pre { white-space: pre-wrap; font-family: var(--f); font-size: 13px; color: var(--muted); margin: 8px 0 0; }

/* strategies */
.sec { margin-top: 30px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
.sec-h h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13px; }
.sum { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.sum span { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.sum b { color: var(--fg); font-variant-numeric: tabular-nums; }
.strats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; align-items: start; }
.strat { padding: 16px; display: grid; gap: 10px; }
.strat .sh { display: flex; align-items: flex-start; gap: 10px; }
.strat h3 { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.3; }
.strat .meta { color: var(--muted); font-size: 12.5px; }
.strat .slot { margin-left: auto; }
.strat .res { font-size: 13.5px; font-weight: 600; }
.sets { display: flex; flex-wrap: wrap; gap: 6px; }
.sets span { font-size: 12.5px; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; color: var(--muted); }
.sets b { color: var(--fg); font-weight: 700; }
.extra { font-size: 12.5px; color: var(--warn); }
.code { position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); overflow: hidden; }
.code pre { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--fg); max-height: 150px; overflow: auto; white-space: pre; tab-size: 4; }
.code.open pre { max-height: 560px; }
.code:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(transparent, var(--code-bg)); pointer-events: none; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 9px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.done { background: var(--ok); border-color: var(--ok); }
.acts .file { color: var(--faint); font-size: 12px; font-family: var(--mono); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.foot { margin-top: 26px; color: var(--faint); font-size: 12px; }
@media (max-width: 560px) { .kv li { grid-template-columns: minmax(0, 1fr); gap: 0; } .acts .file { margin-left: 0; } }
</style>

3.\ngateSym = volSym == \"\" ? syminfo.tickerid : volSym\ndRet = request.security(gateSym, \"D\", (close / close[1] - 1.0)[1], lookahead=barmerge.lookahead_on)\nrvol20 = request.security(gateSym, \"D\", (ta.stdev(close / close[1] - 1.0, 20) * math.sqrt(252))[1], lookahead=barmerge.lookahead_on)\nvolOK = na(rvol20) or rvol20 < volCeil\n\n// Session + DOW\nhET = hour(time, \"America/New_York\")\nmET = minute(time, \"America/New_York\")\netMin = hET * 60 + mET\ndowET = dayofweek(time, \"America/New_York\")\nisWed = dowET == dayofweek.wednesday\nrthFlag = not na(time(timeframe.period, \"0930-1600\", \"America/New_York\"))\n\n// RTH VWAP anchored\nrthStart = rthFlag and not nz(rthFlag[1], false)\nvwapVal = ta.vwap(hlc3, rthStart)\n\n// 20-EMA trail on RTH bars only, restarted each session (as in the backtest:\n// the exporter seeds it with the first RTH close and ignores overnight bars)\nvar float ema20 = na\nif rthStart\n    ema20 := close\nelse if rthFlag\n    ema20 := close * 2.0 / (ema20Len + 1) + nz(ema20, close) * (1.0 - 2.0 / (ema20Len + 1))\n\n// Build OR 9:30-9:45\nvar float orHigh = na\nvar float orLow  = na\nvar bool  orSet  = false\nif rthStart\n    orHigh := na\n    orLow := na\n    orSet := false\nif rthFlag and etMin >= 9*60+30 and etMin < 9*60+45\n    orHigh := na(orHigh) ? high : math.max(orHigh, high)\n    orLow  := na(orLow)  ? low  : math.min(orLow, low)\nif rthFlag and etMin >= 9*60+45 and not orSet\n    orSet := true\n\n// Trade state\nvar float sEntry = na\nvar float sSL    = na\nvar int   sBar   = na\nvar int   sDayId = na\ncurDayId = year*10000 + month*100 + dayofmonth\n\n// Re-entry is deliberate and load-bearing. Capping this at one trade per day\n// drops the strategy's standalone pass rate from 46% to 9%: later entries have\n// a markedly higher hit rate (37% on the first, 61% by the seventh) because by\n// then the trend is established. The only guard is that no two positions run\n// at once.\ntrigger = not isWed and volOK and rthFlag and orSet and etMin > 9*60+45 and etMin < 15*60 and close > orHigh and close > vwapVal and na(sEntry) and barstate.isconfirmed\nif trigger\n    orRange = orHigh - orLow\n    sl0 = math.max(orLow, close - orRange)\n    if sl0 < close\n        sEntry := close\n        sSL    := sl0\n        sBar   := bar_index\n        sDayId := curDayId\n\n// Exit management: trail + SL hit + EOD\nisEOD = etMin >= 15*60+55\ndayChg = ta.change(curDayId) != 0\n\n// The stop is tested against the stop as it stood before this bar, and only\n// then raised to the EMA, the same order as the backtest.\nif not na(sEntry) and bar_index > sBar      // the stop works from the bar after entry\n    exReason = \"\"\n    exPx = 0.0\n    if low <= sSL\n        exReason := \"SL\"\n        // a trailed stop above the market fills at the open, not at the stop\n        exPx := math.min(sSL, open)\n    else if isEOD or dayChg\n        exReason := \"EOD\"\n        exPx := close\n    else if ema20 > sSL\n        sSL := ema20\n    if exReason != \"\"\n        pnl = exPx - sEntry\n        if showHist\n            label.new(bar_index, exPx, \"S1 \" + exReason + \"\\n\" + str.tostring(pnl, \"+#.#\") + \"pt\", color=pnl >= 0 ? color.new(color.green, 20) : color.new(color.red, 20), textcolor=color.white, style=label.style_label_down, size=size.tiny)\n        sEntry := na\n        sSL := na\n\n// Entry marker (historical)\nplotshape(showHist and trigger, \"S1 entry\", shape.triangleup, location.belowbar, color=color.lime, size=size.small, text=\"S1\")\n\n// Live lines\nvar line eLn = na\nvar line slLn = na\nif barstate.islast\n    if not na(eLn)\n        line.delete(eLn)\n    if not na(slLn)\n        line.delete(slLn)\n    if not na(sEntry) and sDayId == curDayId\n        eLn := line.new(sBar, sEntry, bar_index + 20, sEntry, color=color.lime, width=2, extend=extend.right)\n        slLn := line.new(sBar, sSL, bar_index + 20, sSL, color=color.new(color.red, 20), style=line.style_dashed, extend=extend.right)\n\n// Reference plots\nplot(rthFlag ? vwapVal : na, \"VWAP (RTH)\", color=color.new(color.aqua, 30), linewidth=1)\nplot(ema20, \"20-EMA (trail)\", color=color.new(color.gray, 40))\nplot(rthFlag and orSet ? orHigh : na, \"OR High\", color=color.new(color.green, 10), linewidth=2, style=plot.style_linebr)\nplot(rthFlag and orSet ? orLow : na, \"OR Low\", color=color.new(color.red, 10), linewidth=2, style=plot.style_linebr)\n\n// Mini status badge\nvar table badge = table.new(position.top_right, 1, 3, border_width=1, bgcolor=color.new(color.black, 30))\nif barstate.islast\n    sessState = etMin < 570 ? \"PRE-OPEN\" : etMin < 585 ? \"BUILDING OR 9:30-9:45\" : etMin < 900 ? \"LIVE 9:45+ (watch entry)\" : etMin < 955 ? \"MID (still ok)\" : \"CLOSE SOON\"\n    sessCol = etMin >= 585 and etMin < 900 ? color.new(color.green, 20) : etMin >= 955 ? color.red : color.new(color.gray, 50)\n    table.cell(badge, 0, 0, \"S1 ORB 15m LONG\", bgcolor=color.new(color.lime, 50), text_color=color.white)\n    table.cell(badge, 0, 1, isWed ? \"WED — SKIP\" : not volOK ? \"VOL TOO HIGH — SKIP (\" + str.tostring(rvol20 * 100, \"#\") + \"%)\" : sessState, bgcolor=isWed or not volOK ? color.red : sessCol, text_color=color.white)\n    table.cell(badge, 0, 2, not na(sEntry) ? \"LIVE: entry \" + str.tostring(sEntry, format.mintick) : \"no position\", text_color=color.white, bgcolor=color.new(color.black, 50))\n", "file": "lucid_1_s1_orb.pine", "group": "funded", "name": "Lucid 1 — ORB (nový)", "note": "sjednoceno s backtestem; ověřeno exportem: −0,5 / +0,4 b./obchod, nejslabší noha knihy", "order": 5, "result": "−0,5 / +0,4 b. na obchod · nejslabší noha", "role": "funded kniha (slabé)", "settings": [["Velikost", "3 MNQ"]], "slot": "Funded", "status": "live", "_id": "i1"}, {"chart": "MNQ · 5 min", "code": "// @version=5\nindicator(\"Lucid 2 — VWAP Band (0.20%, SL 25 / TP 100)\", overlay=true, max_labels_count=500, max_lines_count=50)\n\n// =========================================================================\n// VWAP band break, both directions — USE A 5-MINUTE CHART\n// Entry : 5-min close breaks out of the RTH VWAP +/- 0.20% band (previous\n//         close inside, this close outside); not Wednesday; first trade only\n// SL    : 25 pt from entry (filled at the worse of stop and bar open)\n// TP    : 100 pt from entry\n// Exit  : SL/TP hit OR the 15:55 bar's close. One trade a day.\n//\n// Changed 2026-10-23: the old version traded a plain VWAP cross, which is not\n// what the book was tested on. Measured on NQ 2018-2025 with costs and the\n// vol gate: plain cross +2.3 / +0.7 pt per trade (2018-21 / 2022-25), this\n// band break +3.6 / +3.0 pt (live_spec_exporter, score_live_spec.py).\n// =========================================================================\n\nshowHist = input.bool(true, \"Show historical entries/exits\")\nbandPct  = input.float(0.20, \"Band around VWAP (%)\") / 100.0\nslPts    = input.float(25.0, \"Stop-loss (pt)\")\ntpPts    = input.float(100.0, \"Take-profit (pt)\")\nvolCeil  = input.float(0.30, \"Max 20d realised vol (skip day above this)\")\n\n// See lucid_1 for why this gate exists: point-denominated stops risk far more\n// dollars per trade in a high-volatility regime, and the trailing drawdown\n// arrives correspondingly sooner.\n// Daily values: last COMPLETED session ([1] + lookahead_on), identical in history and\n// real time (lookahead_off would use the forming daily bar live). Fixed 2026-10-23.\nrvol20 = request.security(syminfo.tickerid, \"D\", (ta.stdev(close / close[1] - 1.0, 20) * math.sqrt(252))[1], lookahead=barmerge.lookahead_on)\nvolOK = na(rvol20) or rvol20 < volCeil\n\n// Session + DOW\nhET = hour(time, \"America/New_York\")\nmET = minute(time, \"America/New_York\")\netMin = hET * 60 + mET\ndowET = dayofweek(time, \"America/New_York\")\nisWed = dowET == dayofweek.wednesday\nrthFlag = not na(time(timeframe.period, \"0930-1600\", \"America/New_York\"))\n\n// RTH VWAP anchored\nrthStart = rthFlag and not nz(rthFlag[1], false)\nvwapVal = ta.vwap(hlc3, rthStart)\n\n// Band-break signals (previous bar inside the band, this close outside)\nupB = vwapVal * (1.0 + bandPct)\nloB = vwapVal * (1.0 - bandPct)\nprevRth = nz(rthFlag[1], false) and not rthStart\nxUp = rthFlag and prevRth and close > upB and close[1] <= upB[1]\nxDn = rthFlag and prevRth and close < loB and close[1] >= loB[1]\nis5 = timeframe.period == \"5\"\n\n// Trade state\nvar float vEntry = na\nvar float vSL    = na\nvar float vTP    = na\nvar int   vDir   = na\nvar int   vBar   = na\nvar int   vDayId = na\nvar bool  vDone  = false\ncurDayId = year*10000 + month*100 + dayofmonth\ndayChg = ta.change(curDayId) != 0\nif dayChg\n    vDone := false\n\ncanTrade = is5 and not isWed and volOK and rthFlag and etMin < 15*60+50 and na(vEntry) and not vDone and barstate.isconfirmed\n\nif canTrade and xUp\n    vEntry := close\n    vDir   := 1\n    vSL    := close - slPts\n    vTP    := close + tpPts\n    vBar   := bar_index\n    vDayId := curDayId\nif canTrade and xDn\n    vEntry := close\n    vDir   := -1\n    vSL    := close + slPts\n    vTP    := close - tpPts\n    vBar   := bar_index\n    vDayId := curDayId\n\n// Exit management\nisEOD = etMin >= 15*60+55\nif not na(vEntry) and bar_index > vBar      // stop/target work from the bar after entry\n    exReason = \"\"\n    exPx = 0.0\n    if vDir == 1\n        if low <= vSL\n            exReason := \"SL\"\n            exPx := math.min(vSL, open)\n        else if high >= vTP\n            exReason := \"TP\"\n            exPx := vTP\n        else if isEOD or dayChg\n            exReason := \"EOD\"\n            exPx := close\n    else\n        if high >= vSL\n            exReason := \"SL\"\n            exPx := math.max(vSL, open)\n        else if low <= vTP\n            exReason := \"TP\"\n            exPx := vTP\n        else if isEOD or dayChg\n            exReason := \"EOD\"\n            exPx := close\n    if exReason != \"\"\n        pnl = vDir * (exPx - vEntry)\n        if showHist\n            label.new(bar_index, exPx, \"VWAP \" + exReason + \"\\n\" + str.tostring(pnl, \"+#.#\") + \"pt\", color=pnl >= 0 ? color.new(color.green, 20) : color.new(color.red, 20), textcolor=color.white, style=label.style_label_down, size=size.tiny)\n        vEntry := na\n        vSL := na\n        vTP := na\n        vDir := na\n        vDone := true\n\n// Entry markers (historical)\nplotshape(showHist and xUp and not isWed, \"VWAP long\", shape.triangleup, location.belowbar, color=color.aqua, size=size.small, text=\"VL\")\nplotshape(showHist and xDn and not isWed, \"VWAP short\", shape.triangledown, location.abovebar, color=color.fuchsia, size=size.small, text=\"VS\")\n\n// Live lines\nvar line veLn = na\nvar line vslLn = na\nvar line vtpLn = na\nif barstate.islast\n    if not na(veLn)\n        line.delete(veLn)\n    if not na(vslLn)\n        line.delete(vslLn)\n    if not na(vtpLn)\n        line.delete(vtpLn)\n    if not na(vEntry) and vDayId == curDayId\n        clrDir = vDir == 1 ? color.aqua : color.fuchsia\n        veLn := line.new(vBar, vEntry, bar_index + 20, vEntry, color=clrDir, width=2, extend=extend.right)\n        vslLn := line.new(vBar, vSL, bar_index + 20, vSL, color=color.new(color.red, 20), style=line.style_dashed, extend=extend.right)\n        vtpLn := line.new(vBar, vTP, bar_index + 20, vTP, color=color.new(color.green, 20), style=line.style_dashed, extend=extend.right)\n\n// Reference plots\nplot(rthFlag ? vwapVal : na, \"VWAP (RTH)\", color=color.new(color.yellow, 20), linewidth=2)\nplot(rthFlag ? upB : na, \"upper band\", color=color.new(color.aqua, 40))\nplot(rthFlag ? loB : na, \"lower band\", color=color.new(color.fuchsia, 40))\n\n// Mini status badge\nvar table badgeV = table.new(position.top_right, 1, 3, border_width=1, bgcolor=color.new(color.black, 30))\nif barstate.islast\n    sessStateV = etMin < 570 ? \"PRE-OPEN\" : etMin < 955 ? \"LIVE (watch cross)\" : \"CLOSE SOON\"\n    sessColV = etMin >= 570 and etMin < 955 ? color.new(color.aqua, 30) : color.new(color.gray, 50)\n    table.cell(badgeV, 0, 0, is5 ? \"VWAP BAND\" : \"VWAP BAND: use a 5-minute chart\", bgcolor=is5 ? color.new(color.yellow, 50) : color.red, text_color=color.white)\n    table.cell(badgeV, 0, 1, isWed ? \"WED — SKIP\" : vDone ? \"DONE TODAY\" : sessStateV, bgcolor=isWed ? color.red : vDone ? color.new(color.gray, 30) : sessColV, text_color=color.white)\n    table.cell(badgeV, 0, 2, not na(vEntry) ? \"LIVE \" + (vDir==1?\"L \":\"S \") + str.tostring(vEntry, format.mintick) : \"no position\", text_color=color.white, bgcolor=color.new(color.black, 50))\n", "file": "lucid_2_vwap.pine", "group": "funded", "name": "Lucid 2 — VWAP Band", "note": "nahrát novou verzi: průraz pásma 0,20 %, 1× denně, filtr volatility z dokončeného dne", "order": 3, "result": "+3,6 / +3,0 b. na obchod (2018–21 / 2022–25)", "role": "funded kniha", "settings": [["Velikost", "3 MNQ"], ["SL / TP", "25 / 100 b."]], "slot": "Funded", "status": "live", "_id": "i2"}, {"chart": "–", "file": "lucid_3_monfri.pine", "name": "Lucid 3 — Mon/Fri", "order": 7, "role": "vyřazeno z plánu", "status": "off", "_id": "i3"}, {"chart": "–", "file": "lucid_4_coc.pine", "name": "Lucid 4 — COC", "order": 8, "role": "mimo plán", "status": "off", "_id": "i4"}, {"chart": "1 min", "file": "lucid_5_fomc_fade.pine", "name": "Lucid 5 — FOMC Fade", "order": 6, "role": "kandidát, 8× ročně", "status": "off", "_id": "i5"}, {"chart": "1 / 5 / 30 min", "code": "// @version=5\nindicator(\"Lucid 6 — Noise Area Momentum\", overlay=true, max_labels_count=500, max_lines_count=500)\n\n// Zarattini, Aziz & Barbon (2024), \"Beat the Market\", on NQ. Long and short.\n// sigma(t) = average over the last 14 sessions of |price at time t / 09:30\n// open - 1|. Upper band = max(open, prior close) x (1 + sigma), lower band =\n// min(open, prior close) x (1 - sigma). Decisions only at :00 and :30 from\n// 10:00 to 15:30 ET: long when the close is above the upper band, short when\n// below the lower band. A long exits when the close is below max(upper band,\n// VWAP), a short when above min(lower band, VWAP); an opposite signal\n// reverses. Flat at 15:55. Use a 1-, 5- or 30-minute chart.\n// Hard stop (added 2026-10-23): exit when price moves 0.50% against the entry\n// (filled at the worse of the stop and the bar open). Same edge, worst trade\n// about -125 pt instead of -220 pt.\n//\n// NQ 2018-2025, $1 cost per MNQ: about 1 trade a day, 38% winners, +6.1 pt\n// per trade 2018-2021 and +9.2 pt 2022-2025 with the hard stop (+5.5 / +9.4\n// without it).\n\nlookback = input.int(14, \"Sessions for the noise average\")\nuseVol   = input.bool(true, \"Volatility gate (skip if NQ 20d vol >= ceiling)\")\nvolCeil  = input.float(0.30, \"   vol ceiling\")\nvolSym   = input.string(\"CME_MINI:NQ1!\", \"   vol gate symbol\")\nhardStop = input.float(0.50, \"Hard stop (% from entry, 0 = off)\") / 100.0\n// Daily values: last COMPLETED session ([1] + lookahead_on), identical in history and\n// real time (lookahead_off would use the forming daily bar live). Fixed 2026-10-23.\n\nrvol20 = request.security(volSym, \"D\", (ta.stdev(close / close[1] - 1.0, 20) * math.sqrt(252))[1], lookahead=barmerge.lookahead_on)\nvolOK = not useVol or na(rvol20) or rvol20 < volCeil\n\noMin = hour(time, \"America/New_York\") * 60 + minute(time, \"America/New_York\")\ncMin = hour(time_close, \"America/New_York\") * 60 + minute(time_close, \"America/New_York\")\ntfOK = timeframe.isintraday and timeframe.multiplier <= 30 and 30 % timeframe.multiplier == 0\n\nvar float dOpen = na\nvar float pClose = na\nvar float lastClose = na\nvar int ghost = 0      // direction of a stopped trade until its normal exit\nvar float pv = 0.0\nvar float vv = 0.0\nif oMin == 570\n    pClose := lastClose\n    dOpen := open\n    ghost := 0\n    pv := 0.0\n    vv := 0.0\ninRth = cMin > 570 and cMin <= 960 and not na(dOpen)\nif inRth\n    pv += hlc3 * volume\n    vv += volume\nvw = vv > 0 ? pv / vv : na\nif cMin == 960\n    lastClose := close\n\nvar array<float> buf = array.new<float>(12 * lookback, na)\nvar array<int> cnt = array.new<int>(12, 0)\nvar float ub = na\nvar float lb = na\nvar int pos = 0\nvar float ent = na\nvar int entBar = na\n\n// hard stop, checked on every bar after the entry bar\nstopLvl = pos != 0 and hardStop > 0 ? ent * (1.0 - pos * hardStop) : na\nif pos != 0 and hardStop > 0 and bar_index > entBar and inRth\n    hit = pos == 1 ? low <= stopLvl : high >= stopLvl\n    if hit\n        px = pos == 1 ? math.min(stopLvl, open) : math.max(stopLvl, open)\n        pnl = pos * (px - ent)\n        label.new(bar_index, px, \"NZ STOP \" + str.tostring(pnl, \"+#.##\"), color=color.red, textcolor=color.white, style=label.style_label_down, size=size.small)\n        ghost := pos         // no new entry until the stopped trade's normal exit, as in the backtest\n        pos := 0\n        ent := na\n\nisCheck = tfOK and inRth and cMin >= 600 and cMin <= 930 and cMin % 30 == 0 and barstate.isconfirmed\nif isCheck\n    idx = int((cMin - 600) / 30)\n    n = array.get(cnt, idx)\n    sigma = 0.0\n    if n >= lookback\n        s = 0.0\n        for k = 0 to lookback - 1\n            s += array.get(buf, idx * lookback + k)\n        sigma := s / lookback\n    array.set(buf, idx * lookback + n % lookback, math.abs(close / dOpen - 1.0))\n    array.set(cnt, idx, n + 1)\n    if n >= lookback and not na(pClose)\n        ub := math.max(dOpen, pClose) * (1.0 + sigma)\n        lb := math.min(dOpen, pClose) * (1.0 - sigma)\n        sig = close > ub ? 1 : close < lb ? -1 : 0\n        if pos != 0 or ghost != 0\n            d = pos != 0 ? pos : ghost\n            out = d == 1 ? close < math.max(ub, vw) : close > math.min(lb, vw)\n            if out or (sig != 0 and sig != d)\n                if pos != 0\n                    pnl = pos * (close - ent)\n                    label.new(bar_index, close, \"NZ EXIT \" + str.tostring(pnl, \"+#.##\"), color=pnl >= 0 ? color.green : color.red, textcolor=color.white, style=label.style_label_down, size=size.small)\n                pos := 0\n                ent := na\n                ghost := 0\n        if pos == 0 and ghost == 0 and sig != 0 and volOK\n            pos := sig\n            ent := close\n            entBar := bar_index\n            label.new(bar_index, close, sig == 1 ? \"NZ LONG\" : \"NZ SHORT\", color=sig == 1 ? color.green : color.red, textcolor=color.white, style=sig == 1 ? label.style_label_up : label.style_label_down, size=size.normal)\n\nif pos != 0 and tfOK and cMin >= 955 and cMin <= 960 and barstate.isconfirmed\n    pnl = pos * (close - ent)\n    label.new(bar_index, close, \"NZ EOD \" + str.tostring(pnl, \"+#.##\"), color=pnl >= 0 ? color.green : color.red, textcolor=color.white, style=label.style_label_down, size=size.small)\n    pos := 0\n    ent := na\nif cMin >= 955\n    ghost := 0\n\nplot(inRth ? ub : na, \"upper band\", color=color.new(color.green, 30), style=plot.style_stepline)\nplot(inRth ? lb : na, \"lower band\", color=color.new(color.red, 30), style=plot.style_stepline)\nplot(inRth ? vw : na, \"VWAP\", color=color.new(color.aqua, 30))\nplot(pos != 0 ? ent : na, \"entry\", color=color.yellow, style=plot.style_linebr, linewidth=2)\nplot(pos != 0 and hardStop > 0 ? ent * (1.0 - pos * hardStop) : na, \"hard stop\", color=color.red, style=plot.style_linebr, linewidth=2)\n// Where the next :00/:30 check would close the position (it is a close-of-\n// bar exit at the check, not a resting stop order).\nexitLvl = pos == 1 ? math.max(ub, vw) : pos == -1 ? math.min(lb, vw) : na\nplot(inRth ? exitLvl : na, \"exit level\", color=color.new(color.orange, 0), style=plot.style_linebr, linewidth=2)\n\nvar table tb = table.new(position.top_right, 1, 1, bgcolor=color.new(color.black, 30))\nif barstate.islast\n    msg = not tfOK ? \"NOISE MOMENTUM: use a 1/5/30-minute chart\" : not volOK ? \"VOL TOO HIGH — no new trades\" : pos == 1 ? \"LONG from \" + str.tostring(ent, format.mintick) : pos == -1 ? \"SHORT from \" + str.tostring(ent, format.mintick) : \"flat — next check at :00/:30\"\n    table.cell(tb, 0, 0, msg, text_color=color.white, bgcolor=not tfOK or not volOK ? color.red : pos != 0 ? color.new(color.orange, 20) : color.new(color.gray, 50))\n", "file": "lucid_6_noise_momentum.pine", "group": "funded", "name": "Lucid 6 — Noise Momentum", "note": "nahrát novou verzi: pevný stop 0,50 %, filtr volatility z dokončeného dne", "order": 4, "result": "+5,7 / +8,7 b. na obchod", "role": "funded kniha", "settings": [["Velikost", "3 MNQ"], ["Hard stop", "0,50 %"]], "slot": "Funded", "status": "live", "_id": "i6"}, {"chart": "MNQ · 1 min", "code": "// @version=5\nindicator(\"Lucid 7 — Eval Sprint\", overlay=true, max_labels_count=500, max_lines_count=500)\n\n// Evaluation sprint: one NQ trade a day at the close of the first RTH\n// minute (09:30-09:31 ET), target +0.20% of price, stop -0.40%, otherwise\n// flat at 15:55. Size so the stop costs at most \"Max loss\"; with $1,900 that\n// is a ~$950-1,000 win, so three winning days reach +$3,000 with the best day\n// about a third of the profit (50% consistency rule). One losing day ends the\n// attempt. NQ 2018-2025 with costs: ~35% of attempts pass, ~5 trading days\n// per attempt. Use a 1-minute MNQ chart.\n// Bias \"Auto\": long when NQ's prior daily close is above its 50-day average,\n// short when below. Tested 2018-2025: pass per attempt 39% vs 36% always long,\n// in both 2018-21 and 2022-25 (a small but consistent gain).\n\nmaxLoss  = input.float(1900.0, \"Max loss per trade ($)\")\ntgtPct   = input.float(0.20, \"Target (% of price)\") / 100.0\nstpPct   = input.float(0.40, \"Stop (% of price)\") / 100.0\nptValue  = input.float(2.0, \"$ per point per contract (MNQ = 2)\")\nmaxCts   = input.int(40, \"Max contracts\")\nbiasMode = input.string(\"Auto (50-day trend)\", \"Bias\", options=[\"Auto (50-day trend)\", \"Long\", \"Short\"])\nuseVol   = input.bool(true, \"Volatility gate (skip if NQ 20d vol >= 30%)\")\nvolSym   = input.string(\"CME_MINI:NQ1!\", \"   vol gate symbol\")\n// Daily values: last COMPLETED session ([1] + lookahead_on), identical in history and\n// real time (lookahead_off would use the forming daily bar live). Fixed 2026-10-23.\n\nrvol20 = request.security(volSym, \"D\", (ta.stdev(close / close[1] - 1.0, 20) * math.sqrt(252))[1], lookahead=barmerge.lookahead_on)\nvolOK = not useVol or na(rvol20) or rvol20 < 0.30\ndClose = request.security(volSym, \"D\", (close)[1], lookahead=barmerge.lookahead_on)\ndSma50 = request.security(volSym, \"D\", (ta.sma(close, 50))[1], lookahead=barmerge.lookahead_on)\nbias = biasMode == \"Long\" ? 1 : biasMode == \"Short\" ? -1 : (dClose > dSma50 ? 1 : -1)\n\noMin = hour(time, \"America/New_York\") * 60 + minute(time, \"America/New_York\")\ncMin = hour(time_close, \"America/New_York\") * 60 + minute(time_close, \"America/New_York\")\nis1 = timeframe.period == \"1\"\n\nvar float e = na\nvar float tp = na\nvar float sl = na\nvar int cts = 0\nvar int dir = 0\nvar line eL = na\nvar line tL = na\nvar line sL = na\n\n// entry at the close of the 09:30 bar\nif is1 and oMin == 570 and barstate.isconfirmed and na(e) and volOK\n    dir := bias\n    e := close\n    tp := close * (1.0 + dir * tgtPct)\n    sl := close * (1.0 - dir * stpPct)\n    cts := math.min(maxCts, math.max(1, int(math.floor(maxLoss / (math.abs(e - sl) * ptValue)))))\n    eL := line.new(bar_index, e, bar_index + 30, e, color=color.yellow, width=2, extend=extend.right)\n    tL := line.new(bar_index, tp, bar_index + 30, tp, color=color.lime, width=2, extend=extend.right)\n    sL := line.new(bar_index, sl, bar_index + 30, sl, color=color.red, width=2, extend=extend.right)\n    label.new(bar_index, dir == 1 ? low : high, \"SPRINT \" + (dir == 1 ? \"LONG \" : \"SHORT \") + str.tostring(cts) + \" MNQ\\nwin $\" + str.tostring(cts * math.abs(tp - e) * ptValue, \"#\") + \" / loss $\" + str.tostring(cts * math.abs(e - sl) * ptValue, \"#\"), color=dir == 1 ? color.blue : color.purple, textcolor=color.white, style=dir == 1 ? label.style_label_up : label.style_label_down, size=size.normal)\n\n// exits from the next bar on; a bar touching both counts as the stop\nif not na(e) and not (oMin == 570)\n    rsn = \"\"\n    px = 0.0\n    if (dir == 1 and low <= sl) or (dir == -1 and high >= sl)\n        rsn := \"LOSS\"\n        px := dir == 1 ? math.min(sl, open) : math.max(sl, open)\n    else if (dir == 1 and high >= tp) or (dir == -1 and low <= tp)\n        rsn := \"WIN\"\n        px := dir == 1 ? math.max(tp, open) : math.min(tp, open)\n    else if cMin >= 955\n        rsn := \"EOD\"\n        px := close\n    if rsn != \"\"\n        usd = cts * dir * (px - e) * ptValue\n        line.set_x2(eL, bar_index)\n        line.set_x2(tL, bar_index)\n        line.set_x2(sL, bar_index)\n        line.set_extend(eL, extend.none)\n        line.set_extend(tL, extend.none)\n        line.set_extend(sL, extend.none)\n        label.new(bar_index, px, \"SPRINT \" + rsn + \"\\n\" + (usd >= 0 ? \"+$\" : \"-$\") + str.tostring(math.abs(usd), \"#\"), color=usd >= 0 ? color.green : color.red, textcolor=color.white, style=label.style_label_down, size=size.small)\n        e := na\n\nvar table tb = table.new(position.top_right, 1, 1, bgcolor=color.new(color.black, 30))\nif barstate.islast\n    msg = not is1 ? \"EVAL SPRINT: use a 1-minute chart\" : not volOK ? \"VOL TOO HIGH — no sprint today\" : not na(e) ? \"IN TRADE: \" + (dir == 1 ? \"LONG \" : \"SHORT \") + str.tostring(cts) + \" MNQ  TP \" + str.tostring(tp, format.mintick) + \"  SL \" + str.tostring(sl, format.mintick) : \"next: \" + (bias == 1 ? \"LONG\" : \"SHORT\") + \" at the close of the 09:30 bar\"\n    table.cell(tb, 0, 0, msg, text_color=color.white, bgcolor=not is1 or not volOK ? color.red : not na(e) ? color.new(color.orange, 20) : color.new(color.gray, 50))\n", "file": "lucid_7_eval_sprint.pine", "group": "eval", "name": "Lucid 7 — Eval Sprint 09:31", "note": "nahrát novou verzi: bias a filtr z posledního dokončeného dne; návrh Target 0,25 <script>
(() => {
  const $ = (s) => document.querySelector(s);
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null) continue;
      if (k === "class") el.className = v; else if (k === "text") el.textContent = v; else el.setAttribute(k, v);

  };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const S = { status: null, metrics: null, stats: null, account: null, queue: [], strategies: [], reports: [], log: [], indicators: [], db: "wait", taken: null };
  const AGENTS = [
    { id: "importer", name: "Importér", role: "hledá a sepisuje nové nápady", labels: ["Importér"], color: "#2e6be6", pos: [0.3, 0.28, 0.8] },

  const fH = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Prague", hour: "2-digit", hourCycle: "h23" });

  }

    if (s.phase === "blocked") return { word: "zablokováno", cls: "bad", work: false };

          numTile({ value: String(n((d) => d.status === "candidate")), label: "kandidátů", tone: "gold" }),
          numTile({ value: String(n((d) => d.status === "rejected")), label: "zamítnuto", tone: "bad" })));

      case "optimiser": {

        return h("div", { style: "display:grid;gap:14px" }, part("eval", "Evaluace"), part("book", "Funded"), !m.eval && !m.book ? empty("Zatím bez čísel.") : null);
      }
      case "manager": {

      }
      case "coder": {
        const ind = S.indicators;
        return block("Indikátory TradingView", ind.length ? list("", ind.map((d) => {
          const [w, c] = IND[d.status] || [d.status || "", ""];
          return h("li", {}, h("span", { text: d.name || "" }), h("span", { class: "tag " + c, text: w }), h("span", { class: "sub", text: [d.chart && d.chart !== "–" ? d.chart : null, d.role].filter(Boolean).join(" · ") }));
        })) : empty("Žádné indikátory."));

      case "interpreter": {
        const r = S.reports[0];

          h("details", { class: "more" }, h("summary", { text: "Celý report" }), h("pre", { text: txt })));
      }
    }
    return null;
  }

  function renderAgent() {
    const a = AGENTS.find((x) => x.id === sel), on = activeId() === a.id;
    const steps = S.log.filter((e) => a.labels.includes(e.sphere)).slice(0, 3);
    const kids = [
      h("div", { class: "ah" }, h("span", { class: "dotbig", style: `background:${a.color}` }),

    kids.push(block("Poslední kroky", steps.length ? list("steps", steps.map((e) => h("li", {}, h("time", { text: fmtT(e.t) }), h("span", { text: e.text || "" })))) : empty("Tento agent v poslední směně nic nezapsal.")));
    $("#agent").replaceChildren(...kids);
    for (const b of document.querySelectorAll("#chips button")) b.setAttribute("aria-pressed", String(b.dataset.id === sel));
  }
  function renderChips() {
    const act = activeId();
    $("#chips").replaceChildren(...AGENTS.map((a) => {
      const b = h("button", { type: "button", "data-id": a.id, "aria-pressed": String(a.id === sel) }, h("i", { style: `background:${a.color}` }), a.name, a.id === act ? h("span", { class: "live", text: "● teď" }) : null);
      b.onclick = () => pick(a.id);
      return b;
    }));
  }
  function pick(id) { sel = id; renderAgent(); }

  // ---------- strategies with code ----------
  async function copy(text, btn, pre) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {
      try { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ok = document.execCommand("copy"); } catch (_) {}
    }
    btn.textContent = ok ? "Zkopírováno ✓" : "Označeno – stiskni Ctrl+C";
    btn.classList.toggle("done", ok);
    if (!ok) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    setTimeout(() => { btn.textContent = "Kopírovat kód"; btn.classList.remove("done"); }, 2200);
  }

    if (d.extra) kids.push(h("div", { class: "extra", text: d.extra }));
    if (d.status && d.status !== "live") kids.push(h("div", {}, h("span", { class: "tag " + c, text: w })));
    if (d.code) {
      const pre = h("pre", { text: d.code }), box = h("div", { class: "code" }, pre);
      const cb = h("button", { class: "btn", type: "button", text: "Kopírovat kód" });
      const tb = h("button", { class: "btn ghost", type: "button", text: "Celý kód" });
      cb.onclick = () => copy(d.code, cb, pre);
      tb.onclick = () => { const o = box.classList.toggle("open"); tb.textContent = o ? "Sbalit" : "Celý kód"; };
      kids.push(box, h("div", { class: "acts" }, cb, tb, d.file ? h("span", { class: "file", text: d.file, title: d.file }) : null));
    } else kids.push(empty(`Kód je v repozitáři: ${d.file || "strategy/tradingview"}`));
    return h("div", { class: "card strat" }, ...kids);
  }
  function renderStrats() {
    const m = S.metrics || {};
    for (const [g, el, cap, sum, mk] of [["eval", "#ev", "#ev-cap", "#ev-sum", "eval"], ["funded", "#bk", "#bk-cap", "#bk-sum", "book"]]) {
      const rows = S.indicators.filter((d) => d.group === g).sort((a, b) => (a.order || 0) - (b.order || 0));
      $(el).replaceChildren(...(rows.length ? rows.map(stratCard) : [empty("Zatím žádná finální strategie.")]));
      $(cap).textContent = m[mk] && m[mk].caption ? m[mk].caption : "";
      const t = m[mk] && m[mk].tiles ? m[mk].tiles.slice(0, 2) : [];
      $(sum).replaceChildren(...t.map((x) => h("span", {}, x.label + ": ", h("b", { text: x.value }))));

  }

  // ---------- 3D brain ----------
  const cv = $("#cv"), ctx = cv.getContext("2d");
  let W = 0, H = 0, rotY = -0.85, rotX = 0.22, vY = 0, vX = 0, drag = null, moved = 0, hover = null;
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const pts = [];
  function unit() { const u = rnd() * 2 - 1, t = rnd() * Math.PI * 2, r = Math.sqrt(1 - u * u); return [r * Math.cos(t), u, r * Math.sin(t)]; }
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3200; i++) {
      const [dx, dy, dz] = unit();
      // gyri: keep dots on the ridges of a folded pattern, leave the sulci empty
      const g = Math.sin(dz * 15 + dy * 9 + side * 1.3) * Math.cos(dy * 13 - dx * 8) + 0.6 * Math.sin(dx * 21 + dz * 12 - dy * 5);
      if (g < -0.15) continue;
      const fold = 1 + 0.035 * g;
      let x = side * 0.36 + dx * 0.44 * fold, y = 0.06 + dy * 0.5 * fold, z = dz * 0.8 * fold;
      if (side * x < 0.05) continue;
      if (y < -0.2) y = -0.2 + (y + 0.2) * 0.5;
      if (z > 0.35 && y < -0.05) y = -0.05 + (y + 0.05) * 0.6;
      pts.push([x, y, z, 0]);
    }
  }
  for (let i = 0; i < 420; i++) {
    const [dx, dy, dz] = unit(), f = 1 + 0.06 * Math.sin(dy * 38);
    if (dz > 0.55) continue;
    pts.push([dx * 0.46 * f, -0.36 + dy * 0.17 * f, -0.6 + dz * 0.24 * f, 1]);
  }
  for (let i = 0; i < 140; i++) {
    const a = rnd() * Math.PI * 2, t = rnd();
    pts.push([Math.cos(a) * 0.085, -0.25 - t * 0.6, -0.3 + Math.sin(a) * 0.085 + t * 0.06, 2]);
  }
  function size() {
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function proj(p) {
    const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
    let x = p[0] * cy - p[2] * sy, z = p[0] * sy + p[2] * cy;
    let y = p[1] * cx - z * sx; z = p[1] * sx + z * cx;
    const R = Math.min(W * 0.46, H * 0.5), f = 3.2 / (3.2 - z);
    return [W / 2 + x * R * f, H * 0.5 - y * R * f, z, f];
  }
  let dotRGB = "", fgCol = "", cardCol = "";
  function readColors() { const cs = getComputedStyle(document.documentElement); dotRGB = cs.getPropertyValue("--dot").trim(); fgCol = cs.getPropertyValue("--fg").trim(); cardCol = cs.getPropertyValue("--card").trim(); }
  readColors();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); });
  function draw(t) {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const q = proj(p), a = 0.16 + 0.5 * Math.max(0, Math.min(1, (q[2] + 0.9) / 1.8));
      ctx.fillStyle = `rgba(${dotRGB},${a.toFixed(3)})`;
      const s = (p[3] === 1 ? 1.5 : 1.7) * q[3];
      ctx.fillRect(q[0] - s / 2, q[1] - s / 2, s, s);
    }
    const act = activeId();
    const nodes = AGENTS.map((a) => ({ a, q: proj(a.pos) })).sort((x, y) => x.q[2] - y.q[2]);
    ctx.font = "600 12px Manrope, system-ui, sans-serif"; ctx.textBaseline = "middle";
    for (const { a, q } of nodes) {
      const front = q[2] > -0.25, isSel = a.id === sel, isHov = hover === a.id;
      const r = (isSel ? 10 : isHov ? 9 : 7.5) * q[3];
      ctx.globalAlpha = front ? 1 : 0.45;
      if (a.id === act) {
        const ph = reduced ? 0.5 : (t / 1400) % 1;
        ctx.strokeStyle = a.color; ctx.lineWidth = 2; ctx.globalAlpha = (front ? 1 : 0.45) * (1 - ph);
        ctx.beginPath(); ctx.arc(q[0], q[1], r + 4 + ph * 16, 0, 7); ctx.stroke();
        ctx.globalAlpha = front ? 1 : 0.45;
      }
      if (isSel) { ctx.fillStyle = a.color; ctx.globalAlpha *= 0.18; ctx.beginPath(); ctx.arc(q[0], q[1], r + 7, 0, 7); ctx.fill(); ctx.globalAlpha = front ? 1 : 0.45; }
      ctx.fillStyle = a.color; ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 7); ctx.fill();
      ctx.strokeStyle = cardCol; ctx.lineWidth = 2; ctx.stroke();
      const label = a.name, tw = ctx.measureText(label).width;
      let lx = q[0] + r + 7;
      if (lx + tw > W - 4) lx = q[0] - r - 7 - tw;
      ctx.fillStyle = cardCol; ctx.globalAlpha = (front ? 0.85 : 0.35);
      ctx.fillRect(lx - 3, q[1] - 9, tw + 6, 18);
      ctx.globalAlpha = front ? 1 : 0.45; ctx.fillStyle = fgCol; ctx.fillText(label, lx, q[1] + 0.5);
      a.sx = q[0]; a.sy = q[1]; a.lx = lx; a.lw = tw;
      ctx.globalAlpha = 1;
    }
    if (!drag) {
      rotY += vY; rotX = Math.max(-0.75, Math.min(0.75, rotX + vX)); vY *= 0.94; vX *= 0.94;
      if (!reduced && Math.abs(vY) < 0.0015) rotY += 0.0022;
    }
  }
  function hit(x, y) {
    let best = null, bd = 22;
    for (const a of AGENTS) {
      if (a.sx == null) continue;
      const d = Math.hypot(a.sx - x, a.sy - y);
      const onLabel = x > a.lx - 3 && x < a.lx + a.lw + 3 && Math.abs(y - a.sy) < 10;
      if (onLabel) return a;
      if (d < bd) { bd = d; best = a; }
    }
    return best;
  }
  const loc = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY }; moved = 0; vX = vY = 0; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
  cv.addEventListener("pointermove", (e) => {
    if (drag) {
      const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
      rotY += dx * 0.009; rotX = Math.max(-0.75, Math.min(0.75, rotX + dy * 0.009));
      vY = dx * 0.009; vX = dy * 0.009; drag.lx = e.clientX; drag.ly = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      if (reduced) draw(0);
      return;
    }
    const [x, y] = loc(e), a = hit(x, y);
    hover = a ? a.id : null; cv.style.cursor = a ? "pointer" : "grab";
    if (reduced) draw(0);
  });
  cv.addEventListener("pointerup", (e) => {
    const wasClick = drag && moved < 6; drag = null; cv.style.cursor = "grab";
    if (wasClick) { const [x, y] = loc(e), a = hit(x, y); if (a) pick(a.id); }
    if (reduced) { vX = vY = 0; draw(0); }
  });
  cv.addEventListener("pointerleave", () => { hover = null; });
  new ResizeObserver(() => { size(); draw(performance.now()); }).observe(cv);
  function loop(t) { draw(t); requestAnimationFrame(loop); }

  function refresh() { renderTop(); renderChips(); renderAgent(); renderStrats(); }
  refresh();
  setInterval(renderTop, 30000);
  requestAnimationFrame(loop);

  // ---------- offline snapshot (jarvis_offline.html carries window.JARVIS_SNAPSHOT) ----------
  function loadSnapshot() {
    const X = window.JARVIS_SNAPSHOT;
    if (!X) return false;
    const by = (a, k, dir) => [...(a || [])].sort((x, y) => (x[k] > y[k] ? 1 : -1) * (dir === "desc" ? -1 : 1));
    const b = X.brain || {};
    Object.assign(S, { status: b.status || null, metrics: b.metrics || null, stats: b.stats || null, account: b.account || null,
      log: b.log && Array.isArray(b.log.events) ? b.log.events : [], queue: by(X.queue, "order"), strategies: by(X.strategies, "order"),
      reports: by(X.reports, "date", "desc"), indicators: by(X.indicators, "order"), db: "snap", taken: X.taken || null });
    refresh();
    return true;
  }

  // ---------- live data ----------
  const docs = (snap) => snap.docs.map((d) => Object.assign({ _id: d.id }, d.data()));
  (async () => {
    const db = window.claude ? await window.claude.use("db") : null;
    if (!db) { if (!loadSnapshot()) { S.db = "off"; refresh(); } return; }
    S.db = "on"; refresh();
    const fail = () => { S.db = "off"; refresh(); };
    const one = (path, key) => db.doc(path).onSnapshot((s) => { S[key] = s.exists ? s.data() : null; refresh(); }, fail);
    one("brain/status", "status");
    one("brain/metrics", "metrics");
    one("brain/stats", "stats");
    one("brain/account", "account");
    db.doc("brain/log").onSnapshot((s) => { const d = s.exists ? s.data() : null; S.log = d && Array.isArray(d.events) ? d.events : []; renderAgent(); }, fail);
    db.collection("queue").orderBy("order").onSnapshot((s) => { S.queue = docs(s); renderAgent(); }, fail);
    db.collection("strategies").orderBy("order").onSnapshot((s) => { S.strategies = docs(s); renderAgent(); }, fail);
    db.collection("reports").orderBy("date", "desc").limit(5).onSnapshot((s) => { S.reports = docs(s); renderAgent(); }, fail);
    db.collection("indicators").orderBy("order").onSnapshot((s) => { S.indicators = docs(s); renderAgent(); renderStrats(); }, fail);
  })();
})();
</script>
