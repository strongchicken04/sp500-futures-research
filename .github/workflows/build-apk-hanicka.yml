# Builds the standalone Android APK for Haničky Řecko.
name: Build Haničky Řecko APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/zviraatkovy-denik-app-x0gmd7
    paths:
      - 'hanicky-recko/**'
      - '.github/workflows/build-apk-hanicka.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanicky-recko
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hanicky-recko/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Use the persistent signing key
        # The Expo template signs release builds with android/app/debug.keystore.
        # Swapping in the committed keystore keeps every build installable over
        # the previous one, so her entries survive updates.
        run: cp credentials/android.keystore android/app/debug.keystore

      - name: Build only phone ABIs
        # printf with a leading newline — the generated gradle.properties has no
        # trailing newline, so a bare `echo >>` would corrupt its last property.
        run: printf '\nreactNativeArchitectures=armeabi-v7a,arm64-v8a\n' >> android/gradle.properties

      - name: Sanity-check the JS bundle (readable error if Metro fails)
        run: npx expo export --platform android --output-dir /tmp/export-canary

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk hanicky-recko.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hanicky-recko-apk
          path: hanicky-recko/hanicky-recko.apk

      - name: Publish GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hanicky-recko-v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" hanicky-recko.apk \
            --title "Haničky Řecko — Android APK (build ${{ github.run_number }})" \
            --notes "Instalační balíček aplikace **Haničky Řecko** pro Android. Stáhni \`hanicky-recko.apk\` do telefonu, povol instalaci z neznámých zdrojů a nainstaluj." \
            --target "${{ github.sha }}"
